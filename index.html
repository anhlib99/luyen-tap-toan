<style>
:root{
  --nen:#f3f5fb;--the:#ffffff;--the2:#f5f6fb;--chu:#101828;--mo:#5f6b85;--vien:#e3e7f0;--vien2:#cfd5e3;
  --chinh:#4f46e5;--chinh-dam:#4338ca;--chinh2:#eef0ff;--chinh3:#c7cbff;--chu-tren-chinh:#ffffff;--tim:#7c3aed;
  --dung:#047857;--dung2:#e6f7ef;--sai:#d61f45;--sai2:#ffedf0;--vang:#a25a00;--vang2:#fff4de;--cam:#ea6a0c;
  --xanh-ngoc:#0f8b8d;--hinh-nen:#ffffff;--phu-mo:rgba(15,20,40,.5);
  --bong:0 1px 2px rgba(16,24,40,.05),0 6px 20px rgba(16,24,40,.06);--bong-lon:0 10px 40px rgba(30,35,90,.18);
  --nen-dau:rgba(255,255,255,.82);--hero:linear-gradient(135deg,#4f46e5 0%,#7c3aed 55%,#c026d3 100%);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --nen:#0b1020;--the:#141a2d;--the2:#1b2237;--chu:#e8ebf6;--mo:#9aa4bf;--vien:#273049;--vien2:#36405e;
  --chinh:#8f95ff;--chinh-dam:#a9adff;--chinh2:#1f2550;--chinh3:#3a418a;--chu-tren-chinh:#0b1020;--tim:#b18cff;
  --dung:#4fd69c;--dung2:#10301f;--sai:#ff8095;--sai2:#3a1720;--vang:#f5b84a;--vang2:#34270e;--cam:#ff9a55;
  --xanh-ngoc:#45c9cb;--hinh-nen:#f4f6fb;--phu-mo:rgba(0,0,0,.62);
  --bong:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);--bong-lon:0 10px 40px rgba(0,0,0,.5);
  --nen-dau:rgba(11,16,32,.82);--hero:linear-gradient(135deg,#3b35b8 0%,#5b2bb5 55%,#8e1f9c 100%);color-scheme:dark}}
:root[data-theme="dark"]{
  --nen:#0b1020;--the:#141a2d;--the2:#1b2237;--chu:#e8ebf6;--mo:#9aa4bf;--vien:#273049;--vien2:#36405e;
  --chinh:#8f95ff;--chinh-dam:#a9adff;--chinh2:#1f2550;--chinh3:#3a418a;--chu-tren-chinh:#0b1020;--tim:#b18cff;
  --dung:#4fd69c;--dung2:#10301f;--sai:#ff8095;--sai2:#3a1720;--vang:#f5b84a;--vang2:#34270e;--cam:#ff9a55;
  --xanh-ngoc:#45c9cb;--hinh-nen:#f4f6fb;--phu-mo:rgba(0,0,0,.62);
  --bong:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);--bong-lon:0 10px 40px rgba(0,0,0,.5);
  --nen-dau:rgba(11,16,32,.82);--hero:linear-gradient(135deg,#3b35b8 0%,#5b2bb5 55%,#8e1f9c 100%);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--nen);color:var(--chu);font:16px/1.55 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{overflow-x:clip}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
h1,h2,h3{line-height:1.25;letter-spacing:-.01em}
.icon{width:20px;height:20px;flex:none;vertical-align:-4px}
#app{max-width:780px;margin:0 auto;padding-block:0 140px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* ---- đầu trang ---- */
.dau{position:sticky;top:0;z-index:15;display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 14px;padding:10px max(16px,env(safe-area-inset-left,0px));
  background:var(--nen-dau);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--vien)}
.thuong-hieu{display:flex;align-items:center;gap:10px;min-width:0}
.thuong-hieu h1{font-size:17px;margin:0;font-weight:800;white-space:nowrap}
.ten-hs{font-size:12.5px;color:var(--mo);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{width:36px;height:36px;border-radius:11px;background:var(--hero);color:#fff;display:grid;place-items:center;font:700 17px/1 "Times New Roman",serif;font-style:italic;box-shadow:0 4px 12px rgba(79,70,229,.35);flex:none}
.logo.lon{width:64px;height:64px;border-radius:20px;font-size:30px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);box-shadow:none}
.dau-phai{display:flex;align-items:center;gap:8px;flex:none}
.anh-dd{width:38px;height:38px;border-radius:50%;border:0;background:var(--chinh2);color:var(--chinh);font-weight:700;font-size:14px;display:grid;place-items:center;padding:0}
.anh-dd:hover{box-shadow:0 0 0 3px var(--chinh3)}
/* ---- thẻ, chữ ---- */
.the{background:var(--the);border:1px solid var(--vien);border-radius:18px;padding:16px;margin:12px 0;box-shadow:var(--bong)}
.the h3{margin:0 0 8px;font-size:16px}
.tieu-de{font-size:22px;font-weight:800;margin:4px 0 2px}
.phu-de{color:var(--mo);font-size:14px;margin:0 0 10px}
.mo{color:var(--mo);font-size:14px}
.nho{font-size:13px}
.chu-thich{color:var(--mo);font-style:italic}
.loi{color:var(--sai);font-size:14px;min-height:1px}
.duong-dan{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:13px;color:var(--mo);margin:2px 0 8px}
.duong-dan a{color:var(--chinh);text-decoration:none;cursor:pointer;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--chinh2)}
.duong-dan a:hover{background:var(--chinh3)}
.duong-dan .ngan{opacity:.5}
/* ---- lời chào ---- */
.chao{position:relative;overflow:hidden;background:var(--hero);color:#fff;border-radius:22px;padding:20px 18px;margin:4px 0 18px;box-shadow:0 12px 30px rgba(79,70,229,.28)}
.chao h2{margin:0;font-size:22px;font-weight:800}
.chao p{margin:4px 0 0;opacity:.9;font-size:14px}
.chao .ki-hieu-nen,.dn-hero .ki-hieu-nen{opacity:.16}
.so-lieu{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;position:relative}
.so-lieu div{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:10px 8px;text-align:center}
.so-lieu b{display:block;font-size:22px;line-height:1.1}
.so-lieu span{font-size:12px;opacity:.9}
.ki-hieu-nen{position:absolute;inset:0;pointer-events:none;font:italic 700 28px/1 "Times New Roman",serif;color:#fff}
.ki-hieu-nen span{position:absolute}
/* ---- danh sách ---- */
.ds{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.ds.luoi{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.ds li{background:var(--the);border:1px solid var(--vien);border-radius:16px;padding:12px 12px 12px 12px;display:flex;align-items:center;gap:12px;cursor:pointer;box-shadow:var(--bong);transition:transform .12s ease,box-shadow .12s ease,border-color .12s}
.ds li:hover{border-color:var(--chinh3);transform:translateY(-1px)}
.ds li:active{transform:scale(.99);background:var(--chinh2)}
.o-bieu-tuong{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:17px;flex:none;color:#fff;background:var(--chinh)}
.o-bieu-tuong.m0{background:linear-gradient(135deg,#6366f1,#4f46e5)}
.o-bieu-tuong.m1{background:linear-gradient(135deg,#14b8a6,#0f8b8d)}
.o-bieu-tuong.m2{background:linear-gradient(135deg,#fb923c,#ea580c)}
.o-bieu-tuong.m3{background:linear-gradient(135deg,#f472b6,#db2777)}
.o-bieu-tuong.m4{background:linear-gradient(135deg,#a78bfa,#7c3aed)}
.o-bieu-tuong.m5{background:linear-gradient(135deg,#38bdf8,#0284c7)}
.ds-chu{flex:1;min-width:0}
.o-bieu-tuong.mkpi{background:linear-gradient(135deg,#c4a5ff,#f0abfc);color:#fff;font-size:22px;box-shadow:0 4px 12px rgba(167,139,250,.45)}
.ds li.kpi{background:linear-gradient(135deg,#f7f0ff,#fdf0ff);border-color:#dcc6ff}
.chip.chip-kpi{background:#efe4ff;color:#6d28d9;border-color:#d6bcff}
.nut-meo{background:#f1e9ff;color:#6d28d9;box-shadow:none}
.meo{display:flex;gap:10px;align-items:flex-start;margin:6px 0 8px;padding:11px 13px;border-radius:14px;background:#f5efff;border:1px solid #ddc9ff;font-size:14.5px;line-height:1.7}
.meo .icon{color:#7c3aed;margin-top:3px}
.nut-kpi{position:relative;overflow:hidden;width:100%;margin-top:14px;padding:16px 18px;border:0;border-radius:20px;background:linear-gradient(135deg,#efe4ff 0%,#e4d4ff 45%,#fde4ff 100%);color:#5b21b6;box-shadow:0 10px 26px rgba(124,58,237,.25),inset 0 0 0 2px #d4b8ff;display:flex;align-items:center;justify-content:center;text-align:center;animation:nhip 2.4s ease-in-out infinite}
.nut-kpi .kpi-chu{position:relative;display:flex;flex-direction:column;gap:2px}
.nut-kpi b{font-size:20px;font-weight:800;letter-spacing:.02em}
.nut-kpi small{font-size:13px;font-weight:600;opacity:.85}
.nut-kpi .sao{position:absolute;color:#a78bfa;font-size:18px;animation:lap 1.8s ease-in-out infinite}
.nut-kpi .s1{left:6%;top:18%}.nut-kpi .s2{left:18%;bottom:14%;color:#f0abfc;animation-delay:.4s}.nut-kpi .s3{right:7%;top:16%;color:#f0abfc;animation-delay:.8s}.nut-kpi .s4{right:19%;bottom:12%;animation-delay:1.2s}.nut-kpi .s5{left:50%;top:4%;font-size:12px;color:#c084fc;animation-delay:.6s}
.kpi-xong{justify-content:center;background:linear-gradient(135deg,#efe4ff,#fde4ff);color:#6d28d9;font-weight:700}
@keyframes nhip{0%,100%{transform:scale(1)}50%{transform:scale(1.015)}}
@keyframes lap{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ds li.kpi{background:linear-gradient(135deg,#221a3d,#2a1a38);border-color:#4a3a78}:root:not([data-theme="light"]) .chip.chip-kpi,:root:not([data-theme="light"]) .nut-meo{background:#2e2350;color:#d4bfff;border-color:#4a3a78}:root:not([data-theme="light"]) .meo{background:#221a3d;border-color:#4a3a78}:root:not([data-theme="light"]) .nut-kpi,:root:not([data-theme="light"]) .kpi-xong{background:linear-gradient(135deg,#3a2a66,#4a2f7a 50%,#5a2c6e);color:#efe2ff;box-shadow:0 10px 26px rgba(0,0,0,.4),inset 0 0 0 2px #6b4fb0}}
:root[data-theme="dark"] .ds li.kpi{background:linear-gradient(135deg,#221a3d,#2a1a38);border-color:#4a3a78}:root[data-theme="dark"] .chip.chip-kpi,:root[data-theme="dark"] .nut-meo{background:#2e2350;color:#d4bfff;border-color:#4a3a78}:root[data-theme="dark"] .meo{background:#221a3d;border-color:#4a3a78}:root[data-theme="dark"] .nut-kpi,:root[data-theme="dark"] .kpi-xong{background:linear-gradient(135deg,#3a2a66,#4a2f7a 50%,#5a2c6e);color:#efe2ff}
.ds-chu b{display:block;font-weight:600;font-size:15.5px;line-height:1.35}
.ds-chu small{display:block;color:var(--mo);font-size:13px;margin-top:2px}
.ds-phai{display:flex;align-items:center;gap:6px;color:var(--mo);flex:none}
.thanh-td{display:block;height:6px;border-radius:99px;background:var(--the2);overflow:hidden;margin-top:7px;max-width:220px}
.thanh-td i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#22c55e,#059669)}
.nhan{font-size:12px;font-weight:600;border-radius:99px;padding:3px 10px;white-space:nowrap;background:var(--the2);color:var(--mo)}
.nhan.d100{background:var(--dung2);color:var(--dung)}
.nhan.dmot{background:var(--vang2);color:var(--vang)}
.chip-hang{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:99px;padding:3px 10px;background:var(--the2);color:var(--mo);border:1px solid var(--vien)}
.chip.muc-nb{background:#e6f7f3;color:#0b7a6b;border-color:#bfe9df}
.chip.muc-th{background:#e8f1ff;color:#1d5fd1;border-color:#c5dbff}
.chip.muc-vd{background:#fff1e6;color:#b4500a;border-color:#ffd6b5}
.chip.muc-vdc{background:#ffeaf1;color:#c01852;border-color:#ffc6d8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.muc-nb{background:#0f2e2a;color:#5fd9c4;border-color:#1d4a43}:root:not([data-theme="light"]) .chip.muc-th{background:#132644;color:#8cb8ff;border-color:#24406b}:root:not([data-theme="light"]) .chip.muc-vd{background:#33210f;color:#ffad6b;border-color:#57381a}:root:not([data-theme="light"]) .chip.muc-vdc{background:#371525;color:#ff8db4;border-color:#5a2238}}
:root[data-theme="dark"] .chip.muc-nb{background:#0f2e2a;color:#5fd9c4;border-color:#1d4a43}:root[data-theme="dark"] .chip.muc-th{background:#132644;color:#8cb8ff;border-color:#24406b}:root[data-theme="dark"] .chip.muc-vd{background:#33210f;color:#ffad6b;border-color:#57381a}:root[data-theme="dark"] .chip.muc-vdc{background:#371525;color:#ff8db4;border-color:#5a2238}
/* ---- nút ---- */
.nut{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:11px 18px;min-height:44px;background:var(--chinh);color:var(--chu-tren-chinh);font-weight:700;box-shadow:0 4px 12px rgba(79,70,229,.25);transition:transform .1s,filter .15s}
.nut:hover{filter:brightness(1.07)}
.nut:active{transform:scale(.98)}
.nut.phu{background:var(--chinh2);color:var(--chinh);box-shadow:none}
.nut.vien{background:var(--the);color:var(--chu);border:1px solid var(--vien2);box-shadow:none}
.nut.nhe{background:transparent;color:var(--chinh);padding:8px 8px;min-height:36px;box-shadow:none}
.nut.canh-bao{background:var(--vang2);color:var(--vang);box-shadow:none}
.nut.xanh{background:linear-gradient(135deg,#10b981,#047857);color:#fff;box-shadow:0 4px 12px rgba(4,120,87,.28)}
.nut.rong{width:100%}
.nut:disabled{opacity:.5;cursor:default}
.hang-nut{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.hang-nut .gian{flex:1}
/* ---- ô nhập ---- */
input[type=text],input[type=password],textarea,select{font:inherit;border:1.5px solid var(--vien2);border-radius:12px;padding:10px 12px;width:100%;background:var(--the);color:var(--chu);transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--chinh);box-shadow:0 0 0 4px var(--chinh2)}
label{font-size:13.5px;font-weight:600;color:var(--mo);display:block;margin:12px 0 6px}
.o-nhap{position:relative}
.o-nhap .icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--mo);pointer-events:none}
.o-nhap input{padding-left:42px;min-height:48px}
.o-nhap .hien-mk{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--mo);cursor:pointer}
.o-nhap .hien-mk .icon{position:static;transform:none}
.o-nhap .hien-mk:hover{background:var(--the2)}
.luoi-2{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:560px){.luoi-2{grid-template-columns:1fr 1fr}}
/* ---- đăng nhập ---- */
.dn-hero{position:relative;overflow:hidden;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:44px 20px 84px;background:var(--hero);color:#fff;text-align:center;border-radius:0 0 32px 32px}
.dn-hero h1{margin:14px 0 4px;font-size:28px;font-weight:800}
.dn-hero p{margin:0;opacity:.9}
.dn-hero .logo{margin:0 auto;position:relative}
.dn-the{max-width:420px;margin:-60px auto 0;position:relative;padding:22px 20px;border-radius:22px;box-shadow:var(--bong-lon)}
.dn-the h2{margin:0 0 2px;font-size:20px}
.dn-the .nut{margin-top:18px;min-height:50px;font-size:16px}
.dn-the .loi{margin:10px 0 0}.dn-the .loi:empty{display:none}
.dn-chan{max-width:420px;margin:14px auto;text-align:center}
/* ---- đề bài ---- */
.de{font-size:16.5px;line-height:1.7}
.tieu-de-de{font-size:18px;margin:2px 0 8px;font-weight:700}
.hinh{display:block;width:100%;max-width:440px;margin:14px auto 4px;height:auto;background:var(--hinh-nen);border-radius:14px;border:1px solid var(--vien)}
.hinh-nho{max-width:260px}
/* ---- chọn cách làm ---- */
.luoi-cach{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:560px){.luoi-cach{grid-template-columns:1fr 1fr}}
.the-cach{text-align:left;background:var(--the);color:var(--chu);border:1.5px solid var(--vien);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--bong);transition:border-color .15s,transform .12s}
.the-cach:hover{border-color:var(--chinh);transform:translateY(-1px)}
.the-cach b{font-size:16.5px}
.the-cach span.mo{font-size:13.5px}
.the-cach .chip{align-self:flex-start;margin-top:4px}
.ic-tron{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--chinh2);color:var(--chinh)}
.ic-tron.vang{background:var(--vang2);color:var(--vang)}
.ic-tron.xanh{background:var(--dung2);color:var(--dung)}
/* ---- bài giải ---- */
.dau-bai-giai{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.dau-bai-giai b{font-size:16px}
.thanh-dong{height:8px;border-radius:99px;background:var(--the2);overflow:hidden;margin:4px 0 12px}
.thanh-dong i{display:block;height:100%;background:var(--hero);border-radius:99px;transition:width .3s}
.dong{padding:8px 12px;border-radius:12px;margin:4px 0;border:1.5px solid transparent;line-height:1.9}
.dong.thut1{margin-left:22px}
.dong.hien-tai{background:var(--chinh2);border-color:var(--chinh3);box-shadow:0 0 0 4px color-mix(in srgb,var(--chinh2) 60%,transparent)}
.dong.goi-y{background:var(--vang2);border-color:color-mix(in srgb,var(--vang) 30%,transparent)}
.dong .so-dong{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:99px;background:var(--the2);font-size:11px;font-weight:700;color:var(--mo);margin-right:8px;vertical-align:1px}
.o{display:inline-block;vertical-align:middle;margin:2px 2px;line-height:1.4;max-width:100%}
.o input{max-width:100%;padding:6px 10px;border:2px solid var(--chinh3);border-radius:10px;font:inherit;background:var(--the);color:var(--chu);min-height:40px}
.o input:focus{border-color:var(--chinh)}
.o input:disabled{background:var(--the2);color:var(--chu);border-color:var(--vien)}
.o .xem{display:block;font-size:13px;min-height:0;color:var(--mo);padding-left:2px}
.o.dung input,.o.dung .chon-nut.da{border-color:var(--dung);background:var(--dung2)}
.o.sai input,.o.sai .chon-nut.da{border-color:var(--sai);background:var(--sai2)}
.pt-hang.vua{white-space:nowrap;overflow:hidden}

<body>
<div id="app"><div class="dang-tai">Đang tải…</div></div>
<div id="thanh-ki-hieu"></div>
<div id="hop-thoai"></div>
<script>
/* ============================================================
   ĐỘNG CƠ CHẤM BÀI (dùng chung cho mọi dạng)
   - Đọc cách gõ của học sinh: 2/3, can2, sqrt(2), √2, ^2, dấu . là dấu nhân,
     số thập phân dùng dấu phẩy, vt(AB) (vẫn nhận vec(AB)), 60do.
   - Chấm theo giá trị, không so từng chữ.
   ============================================================ */
var MT = (function () {
  function ucln(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { var t = a % b; a = b; b = t; } return a; }
  function rutCan(n) { // n = a^2 * b
    var a = 1, b = n;
    for (var k = 2; k * k <= b; k++) { while (b % (k * k) === 0) { b /= k * k; a *= k; } }
    return [a, b];
  }
  function so(x) { // hiện số kiểu Việt Nam: dấu phẩy thập phân
    var s = String(Math.round(x * 1e6) / 1e6);
    return s.replace('.', ',');
  }
  function tron(arr, seed) { // xáo trộn theo seed (cố định)
    var a = arr.slice(), s = (seed * 9301 + 49297) % 233280;
    for (var i = a.length - 1; i > 0; i--) {
      s = (s * 9301 + 49297) % 233280;
      var j = Math.floor(s / 233280 * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function chuan(s) {
    s = String(s == null ? '' : s).trim().toLowerCase();
    s = s.replace(/[×·∙]/g, '*').replace(/[÷:]/g, '/').replace(/[−–—]/g, '-')
      .replace(/√/g, 'can').replace(/sqrt/g, 'can').replace(/²/g, '^2').replace(/³/g, '^3')
      .replace(/°/g, 'do').replace(/\s+/g, '');
    return s;
  }

  function tach(s, dauChamThapPhan) {
    var t = [], i = 0, m;
    while (i < s.length) {
      var r = s.slice(i);
      if ((m = (dauChamThapPhan ? /^\d+(?:[.,]\d+)?/ : /^\d+(?:,\d+)?/).exec(r))) {
        t.push({ t: 'n', v: parseFloat(m[0].replace(',', '.')) }); i += m[0].length; continue;
      }
      if (r.indexOf('can') === 0) { t.push({ t: 'can' }); i += 3; continue; }
      if (r.indexOf('pi') === 0) { t.push({ t: 'n', v: Math.PI, pi: true }); i += 2; continue; }
      if (r.indexOf('do') === 0) { t.push({ t: 'do' }); i += 2; continue; }
      var c = s[i];
      if (c === '.') { t.push({ t: '*', cham: true }); i++; continue; }
      if ('+-*/^()'.indexOf(c) >= 0) { t.push({ t: c }); i++; continue; }
      throw new Error('Không đọc được kí tự "' + c + '"');
    }
    return t;
  }

  function docBieuThuc(str, tuyChon) {
    tuyChon = tuyChon || {};
    var s = chuan(str);
    if (!s) throw new Error('Em chưa điền');
    var tk = tach(s, tuyChon.dauChamThapPhan), i = 0;
    function xem() { return tk[i]; }
    function lay(t) { var x = tk[i]; if (!x || (t && x.t !== t)) throw new Error('Biểu thức chưa đúng cách gõ'); i++; return x; }
    function batDauThuaSo(x) { return x && (x.t === 'n' || x.t === 'can' || x.t === '('); }
    function tong() {
      var a = tich();
      while (xem() && (xem().t === '+' || xem().t === '-')) { var o = lay().t; a = { op: o, a: a, b: tich() }; }
      return a;
    }
    function tich() {
      var a = ghep();
      while (xem() && (xem().t === '*' || xem().t === '/')) { var o = lay(); a = { op: o.t, a: a, b: ghep(), cham: o.cham }; }
      return a;
    }
    function ghep() { // nhân ngầm (2can3, 2(…)) gắn chặt hơn phép chia: 1/2can3 = 1/(2√3)
      var a = dau();
      while (batDauThuaSo(xem())) a = { op: '*', a: a, b: luyThua(), ngam: true };
      return a;
    }
    function dau() {
      if (xem() && xem().t === '-') { lay(); return { op: 'am', a: dau() }; }
      if (xem() && xem().t === '+') { lay(); return dau(); }
      return luyThua();
    }
    function luyThua() {
      var a = coBan();
      if (xem() && xem().t === '^') { lay(); a = { op: '^', a: a, b: dau() }; }
      if (xem() && xem().t === 'do') { lay(); a = { op: 'do', a: a }; }
      return a;
    }
    function coBan() {
      var x = lay();
      if (x.t === 'n') return { op: 'n', v: x.v, pi: x.pi };
      if (x.t === 'can') {
        var y = xem();
        if (y && y.t === '(') return { op: 'can', a: coBan() };
        if (y && y.t === 'n') { lay(); return { op: 'can', a: { op: 'n', v: y.v } }; }
        throw new Error('Sau "can" cần một số hoặc dấu ngoặc');
      }
      if (x.t === '(') { var e = tong(); lay(')'); return { op: '()', a: e }; }
      throw new Error('Biểu thức chưa đúng cách gõ');
    }
    var cay = tong();
    if (i !== tk.length) throw new Error('Biểu thức chưa đúng cách gõ');
    return cay;
  }

  function tinh(n) {
    switch (n.op) {
      case 'n': return n.v;
      case '+': return tinh(n.a) + tinh(n.b);
      case '-': return tinh(n.a) - tinh(n.b);
      case '*': return tinh(n.a) * tinh(n.b);
      case '/': return tinh(n.a) / tinh(n.b);
      case '^': return Math.pow(tinh(n.a), tinh(n.b));
      case 'can': return Math.sqrt(tinh(n.a));
      case '()': return tinh(n.a);
      case 'am': return -tinh(n.a);
      case 'do': return tinh(n.a);
    }
    return NaN;
  }
  function coCanVoTi(n) {
    if (!n) return false;
    if (n.op === 'can') { var v = tinh(n.a), r = Math.round(Math.sqrt(v)); if (r * r !== v) return true; }
    return coCanVoTi(n.a) || coCanVoTi(n.b);
  }
  function canOMau(n) {
    if (!n) return false;
    if (n.op === '/' && coCanVoTi(n.b)) return true;
    if (n.op === '^' && tinh(n.b) < 0 && coCanVoTi(n.a)) return true;
    return canOMau(n.a) || canOMau(n.b);
  }
  function boNgoac(n) { return n && n.op === '()' ? n.a : n; }
  function sangTex(n) {
    switch (n.op) {
      case 'n': return n.pi ? '\\pi' : so(n.v);
      case '+': return sangTex(n.a) + '+' + sangTex(n.b);
      case '-': return sangTex(n.a) + '-' + sangTex(n.b);
      case '*':
        var b = sangTex(n.b);
        if (n.ngam && !(n.b.op === 'n' && n.a.op !== 'can')) return sangTex(n.a) + b;
        return sangTex(n.a) + '\\cdot ' + b;
      case '/': return '\\dfrac{' + sangTex(boNgoac(n.a)) + '}{' + sangTex(boNgoac(n.b)) + '}';
      case '^': return '{' + sangTex(n.a) + '}^{' + sangTex(boNgoac(n.b)) + '}';
      case 'can': return '\\sqrt{' + sangTex(boNgoac(n.a)) + '}';
      case '()': return '\\left(' + sangTex(n.a) + '\\right)';
      case 'am': return '-' + sangTex(n.a);
      case 'do': return sangTex(n.a) + '^\\circ';
    }
    return '';
  }
  function bang(x, y) { return isFinite(x) && isFinite(y) && Math.abs(x - y) <= 1e-9 * Math.max(1, Math.abs(y)); }

  function chuanVecto(s) {
    s = String(s == null ? '' : s).toLowerCase().replace(/\s+/g, '')
      .replace(/[→⃗]/g, '').replace(/vec\(|vt\(|\)/g, '').replace(/₁/g, '1').replace(/₂/g, '2').replace(/_/g, '');
    if (!s || /-/.test(s)) return null;
    return s.split('+').filter(Boolean).sort();
  }

  // Vectơ có tên điểm do học sinh tự đặt: vt(AM), vec(AM), AM -> 'AM' (hai chữ in hoa khác nhau) hoặc null
  function docVectoTen(s) {
    s = String(s == null ? '' : s).replace(/\s+/g, '').replace(/^(vt|vec)\(/i, '').replace(/\)$/, '').toUpperCase();
    return /^[A-Z][A-Z]$/.test(s) && s[0] !== s[1] ? s : null;
  }

  // Chấm một ô. Trả về {dung: bool, lyDo: chuỗi (nếu sai vì cách viết)}
  function chamO(o, giaTri) {
    if (giaTri == null || String(giaTri).trim() === '') return { dung: false, trong: true };
    if (o.kiemTra) { var r = o.kiemTra(giaTri); return typeof r === 'object' ? r : { dung: !!r }; }
    try {
      if (o.k === 'chon') return { dung: Number(giaTri) === o.d };
      if (o.k === 'vecto') {
        var a = chuanVecto(giaTri), b = o.d.slice().sort();
        return { dung: !!a && a.join('+') === b.join('+') };
      }
      var cay = docBieuThuc(giaTri, { dauChamThapPhan: o.k === 'thapphan' });
      var v = tinh(cay);
      if (!bang(v, o.d)) return { dung: false };
      if (o.trucCan && canOMau(cay)) return { dung: false, lyDo: 'Kết quả đúng giá trị nhưng chưa trục căn thức ở mẫu' };
      return { dung: true };
    } catch (e) {
      return { dung: false, lyDo: e.message };
    }
  }

  // Xem trước cách hiện của ô học sinh gõ (LaTeX) hoặc null
  function xemTruoc(o, giaTri) {
    if (giaTri == null || String(giaTri).trim() === '') return null;
    try {
      if (o.xemTruoc) return o.xemTruoc(giaTri);
      if (o.k === 'vectoTen') { var vt = docVectoTen(giaTri); return vt ? '\\overrightarrow{' + vt + '}' : null; }
      if (o.k === 'chu') return /^\s*[A-Za-z]\s*$/.test(giaTri) ? String(giaTri).trim().toUpperCase() : null;
      if (o.k === 'vecto') {
        if (!/[a-z0-9]/i.test(String(giaTri).replace(/vec\(|vt\(/gi, ''))) return null;
        var a = String(giaTri).replace(/\s+/g, '').replace(/(?:vec|vt)\(([^)]*)\)/gi, function (_, x) {
          return '\\overrightarrow{' + x.replace(/^([a-z])(\d)$/i, '$1_$2') + '}';
        });
        return a.replace(/\b([a-z])(\d)\b/gi, '\\overrightarrow{$1_$2}');
      }
      return sangTex(docBieuThuc(giaTri, { dauChamThapPhan: o.k === 'thapphan' }));
    } catch (e) { return null; }
  }

  // Tính mức hoàn thành.
  // kq = {cach:'day'|'dapan', tongO, oDungTuLam, xemToanBo, chuaXong, dapAnDung, soLanSai, chiDapAn}
  function tinhMuc(kq) {
    if (kq.cach === 'dapan') {
      if (!kq.dapAnDung) return 0;
      var tran = kq.chiDapAn ? 100 : 99;
      var m = Math.max(50, tran - 10 * (kq.soLanSai || 0));
      if (kq.xemToanBo) m = Math.min(m, 30);
      return m;
    }
    if (!kq.tongO) return 0;
    var muc = Math.round(100 * kq.oDungTuLam / kq.tongO);
    if (muc === 100 && (kq.soGoiY || kq.chuaXong)) muc = 99; // phòng hờ: có gợi ý thì không đạt 100
    if (kq.xemToanBo) muc = Math.min(muc, 30);
    return muc;
  }

  return { ucln: ucln, rutCan: rutCan, so: so, tron: tron, docBieuThuc: docBieuThuc, tinh: tinh,
    canOMau: canOMau, sangTex: sangTex, chamO: chamO, xemTruoc: xemTruoc, tinhMuc: tinhMuc, bang: bang, docVectoTen: docVectoTen };
})();
if (typeof window !== 'undefined') window.MT = MT;
</script>

<script>
/* ============================================================
   NỘI DUNG CÁC DẠNG TOÁN (tách riêng khỏi phần giao diện)
   Mỗi dạng là một khối DANG_TOAN.push({...}) theo cùng một mẫu.
   Thêm dạng mới: chép một khối, sửa nội dung, không cần sửa Index.html.

   Mẫu một câu:
     maCau   : mã duy nhất, KHÔNG đổi sau khi đã có học sinh làm (kết quả lưu theo mã này)
     ten, muc: tên câu, mức (Nhận biết / Thông hiểu / Vận dụng)
     chiDapAn: true nếu câu chỉ cần đáp án (không có cách Giải đầy đủ)
     tao(seed): trả về bộ số p từ mã bộ số seed (cùng seed luôn ra cùng đề)
     de(p)   : đề bài (chữ, công thức đặt trong $...$)
     hinhDe(p): hình của đề (SVG) hoặc null
     dong(p) : các dòng bài giải của thầy. Mỗi dòng {t, o, thut, hinh}
               t   : nội dung, ô trống viết [[0]], [[1]], ...
               o   : danh sách ô, mỗi ô {k: kiểu, d: đáp án, hien: cách hiện đáp án (LaTeX)}
                     k = 'so' | 'thapphan' | 'bieuthuc' | 'vecto' | 'chon'
                     trucCan: true -> đáp án có căn ở mẫu bị chấm chưa đạt
               thut: số bậc thụt đầu dòng; hinh(p): hình vẽ kèm dòng (SVG)
     dapAn(p): đáp án chính {k, d, hien, donVi}
   ============================================================ */
var DANG_TOAN = window.DANG_TOAN || [];

/* ---------- Lớp 10 - Chương IV - Bài 8 - Dạng: ca nô qua sông ---------- */
(function () {
  function lamTron1(x) { return Math.round(x * 10 + 1e-9) / 10; }
  function ganNguong(x) { var f = (x * 10) % 1; return Math.abs(f - 0.5) < 0.08; }

  // Các bộ số hợp lệ (thầy đã duyệt): nước 3..9 km/h, vận tốc riêng 12..30 km/h,
  // AC^2 - CM^2 = a^2.b (a = 2 hoặc 3, b không chính phương), sông rộng S = a km,
  // bỏ các bộ có kết quả sát ngưỡng làm tròn.
  var BO_SO = [];
  for (var u = 3; u <= 9; u++) {
    for (var w = 12; w <= 30; w++) {
      var r = MT.rutCan(w * w - u * u), a = r[0], b = r[1];
      if (a < 2 || a > 3 || b === 1) continue;
      var v = a * Math.sqrt(b), tm = 60 * a / v;
      if (ganNguong(v) || ganNguong(tm)) continue;
      BO_SO.push({ u: u, w: w, d: a, a: a, b: b });
    }
  }

  function tao(seed) {
    var q = BO_SO[seed % BO_SO.length];
    var p = { seed: seed, u: q.u, w: q.w, d: q.d, a: q.a, b: q.b };
    p.am2 = p.w * p.w - p.u * p.u;
    p.v1 = lamTron1(p.a * Math.sqrt(p.b));
    p.tPhut = 60 / Math.sqrt(p.b);
    p.t1 = lamTron1(p.tPhut);
    var g = MT.ucln(60, p.b), n = 60 / g, m = p.b / g;
    p.tPhutTex = m === 1 ? n + '\\sqrt{' + p.b + '}' : '\\dfrac{' + (n === 1 ? '' : n) + '\\sqrt{' + p.b + '}}{' + m + '}';
    p.tGioTex = '\\dfrac{\\sqrt{' + p.b + '}}{' + p.b + '}';
    p.amTex = p.a + '\\sqrt{' + p.b + '}';
    return p;
  }

  function hinhDe(p) { // phong cách màu sinh động theo hình mẫu của thầy
    var navy = '#1B2A6B', xanh = '#1E50C8', do_ = '#E0302A', F = 'font-family="Times New Roman, Liberation Serif, serif" font-weight="bold"';
    var vien = 'stroke="#fff" stroke-width="5" paint-order="stroke"';
    function cay(x, y, r) {
      return '<rect x="' + (x - 3) + '" y="' + (y - 2) + '" width="6" height="' + (r + 4) + '" fill="#8A5A2B"/>' +
        '<circle cx="' + (x - r * 0.45) + '" cy="' + (y - r * 0.2) + '" r="' + r * 0.7 + '" fill="#6DB85E"/>' +
        '<circle cx="' + (x + r * 0.45) + '" cy="' + (y - r * 0.2) + '" r="' + r * 0.7 + '" fill="#5DA84F"/>' +
        '<circle cx="' + x + '" cy="' + (y - r * 0.75) + '" r="' + r * 0.75 + '" fill="#7CC36E" stroke="#4E9A3E" stroke-width="1.2"/>';
    }
    function bui(x, y, r) {
      return '<ellipse cx="' + x + '" cy="' + y + '" rx="' + r * 1.3 + '" ry="' + r + '" fill="#8FCB7E" stroke="#4E9A3E" stroke-width="1.2"/>' +
        '<path d="M' + (x - r * 0.6) + ',' + (y - r * 0.2) + ' q' + r * 0.6 + ',-' + r * 0.7 + ' ' + r * 1.2 + ',0" fill="none" stroke="#4E9A3E" stroke-width="1"/>';
    }
    function song(x, y) { return '<path d="M' + x + ',' + y + ' q5,-5 10,0 t10,0" fill="none" stroke="#6FA9CF" stroke-width="1.6" stroke-linecap="round"/>'; }
    function mui(x1, y, x2) {
      return '<line x1="' + x1 + '" y1="' + y + '" x2="' + (x2 - 10) + '" y2="' + y + '" stroke="' + xanh + '" stroke-width="3" stroke-linecap="round"/>' +
        '<polygon points="' + x2 + ',' + y + ' ' + (x2 - 14) + ',' + (y - 7) + ' ' + (x2 - 14) + ',' + (y + 7) + '" fill="' + xanh + '"/>';
    }
    function ben(x, y) {
      var h = '<rect x="' + (x - 28) + '" y="' + y + '" width="56" height="22" rx="2" fill="#B07A3F" stroke="#5B3A1A" stroke-width="1.8"/>';
      for (var k = 1; k < 5; k++) h += '<line x1="' + (x - 28 + k * 11.2) + '" y1="' + y + '" x2="' + (x - 28 + k * 11.2) + '" y2="' + (y + 22) + '" stroke="#5B3A1A" stroke-width="1"/>';
      return h;
    }
    var s = '<svg viewBox="0 0 560 316" class="hinh" role="img" aria-label="Hình con sông, bến A, bến B và ca nô">';
    s += '<defs><linearGradient id="nuoc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C6E9FA"/><stop offset="1" stop-color="#A5DAF4"/></linearGradient></defs>';
    s += '<rect x="0" y="0" width="560" height="316" fill="#DCEFCB"/>';
    s += '<rect x="0" y="50" width="560" height="7" fill="#EFE3C2" stroke="#C9B48E" stroke-width="1"/>';
    s += '<rect x="0" y="57" width="560" height="196" fill="url(#nuoc)"/>';
    s += '<rect x="0" y="253" width="560" height="7" fill="#EFE3C2" stroke="#C9B48E" stroke-width="1"/>';
    // cây hai bờ (chừa chỗ cho bến và nhãn)
    s += cay(28, 40, 16) + bui(80, 38, 10) + cay(130, 40, 15) + bui(185, 38, 9) + bui(410, 38, 10) + cay(462, 40, 16) + bui(510, 38, 9) + cay(545, 40, 13);
    s += cay(32, 296, 15) + bui(88, 290, 10) + cay(140, 296, 16) + bui(195, 290, 9) + bui(420, 290, 10) + cay(470, 296, 15) + bui(522, 290, 9);
    // gợn sóng
    [[30, 80], [180, 75], [420, 78], [520, 85], [100, 125], [210, 140], [470, 130], [60, 180], [215, 108], [440, 190], [530, 175], [120, 235], [230, 240], [500, 238], [345, 120], [345, 215]]
      .forEach(function (q) { s += song(q[0], q[1]); });
    // dòng nước
    s += mui(40, 100, 150) + mui(420, 100, 530) + mui(40, 212, 150) + mui(420, 212, 530);
    s += '<text x="40" y="162" ' + F + ' font-size="19" fill="' + navy + '" ' + vien + '>' + (p.nhanNuoc || 'Dòng nước ' + p.u + ' km/h') + '</text>';
    // bến và đường AB
    s += ben(280, 34) + ben(280, 254);
    s += '<line x1="280" y1="62" x2="280" y2="248" stroke="' + do_ + '" stroke-width="2.6" stroke-dasharray="9 7"/>';
    s += '<polygon points="280,112 272,126 288,126" fill="' + do_ + '"/>';
    s += '<circle cx="280" cy="56" r="6" fill="#E53935" stroke="#fff" stroke-width="2"/><circle cx="280" cy="254" r="6" fill="#E53935" stroke="#fff" stroke-width="2"/>';
    s += '<text x="318" y="28" ' + F + ' font-size="24" fill="' + navy + '" ' + vien + '><tspan font-style="italic">B</tspan><tspan font-size="16"> (bến B)</tspan></text>';
    s += '<text x="318" y="298" ' + F + ' font-size="24" fill="' + navy + '" ' + vien + '><tspan font-style="italic">A</tspan><tspan font-size="16"> (bến A)</tspan></text>';
    // ca nô (nhìn từ trên, mũi chếch về thượng nguồn)
    s += '<g transform="translate(280 188) rotate(-18)">' +
      '<path d="M0,-30 C11,-18 12,0 11,22 L-11,22 C-12,0 -11,-18 0,-30 Z" fill="#FFFFFF" stroke="' + navy + '" stroke-width="2"/>' +
      '<path d="M0,-22 C6,-14 7,-6 7,0 L-7,0 C-7,-6 -6,-14 0,-22 Z" fill="#378ADD"/>' +
      '<rect x="-9" y="6" width="18" height="5" fill="#E24B4A"/></g>';
    s += '<text x="200" y="196" ' + F + ' font-size="18" fill="' + navy + '" ' + vien + '>Ca nô</text>';
    // bề rộng sông
    s += '<line x1="385" y1="60" x2="385" y2="250" stroke="#1E6FD9" stroke-width="2.4"/>';
    s += '<polygon points="385,58 378,72 392,72" fill="#1E6FD9"/><polygon points="385,252 378,238 392,238" fill="#1E6FD9"/>';
    s += '<text x="395" y="162" ' + F + ' font-size="22" fill="#1E6FD9" ' + vien + '>' + (p.nhanRong || MT.so(p.d) + ' km') + '</text>';
    s += '</svg>';
    return s;
  }

  // Tên điểm học sinh tự đặt khi dựng vectơ (dòng 4, 5). Mặc định như bài giải của thầy: v = AM, v1 = AC, v2 = CM.
  // Chấp nhận mọi cách đặt đúng quy tắc ba điểm: v = AX (X khác A, B), v1 = AY và v2 = YX, hoặc v2 = AY và v1 = YX.
  function tenDiem(st) {
    var gt = st && st.gt, X = 'M', Y = 'C', dao = false;
    var v = gt && gt[3] ? MT.docVectoTen(gt[3][0]) : null;
    var v3 = !!(v && v[0] === 'A' && v[1] !== 'B');
    if (v3) X = v[1];
    function diemOK(y) { return /^[A-Z]$/.test(y) && y !== 'A' && y !== 'B' && y !== X; }
    var a = gt && gt[4] ? MT.docVectoTen(gt[4][0]) : null, b = gt && gt[4] ? MT.docVectoTen(gt[4][1]) : null;
    if (a && a[0] === 'A' && diemOK(a[1])) Y = a[1];
    else if (b && b[0] === 'A' && diemOK(b[1])) { Y = b[1]; dao = true; }
    else if (Y === X) Y = 'C' === X ? 'N' : 'C';
    return { X: X, Y: Y, dao: dao, v3: v3,
      S: 'A' + X, S1: dao ? Y + X : 'A' + Y, S2: dao ? 'A' + Y : Y + X, dinh: dao ? 'A' : X };
  }
  function cungDoan(s, t) { return s === t || s === t[1] + t[0]; }

  function hinhTamGiac(p, ten, hienDai) {
    // vẽ đúng tỉ lệ AX : (v2), co lại để hình nằm trong khung
    var am = p.a * Math.sqrt(p.b), k = Math.min(150 / am, 170 / p.u), H = am * k, cm = p.u * k;
    var Ax = ten.dao ? Math.min(110, 230 - cm) : Math.max(150, 42 + cm), Ay = 205, Mx = Ax, My = Ay - H, By = My - 34;
    var Cx = ten.dao ? Ax + cm : Mx - cm, Cy = ten.dao ? Ay : My;
    function mui(x1, y1, x2, y2, mau) {
      var g = Math.atan2(y2 - y1, x2 - x1), l = 10;
      var p1 = (x2 - l * Math.cos(g - 0.4)) + ',' + (y2 - l * Math.sin(g - 0.4));
      var p2 = (x2 - l * Math.cos(g + 0.4)) + ',' + (y2 - l * Math.sin(g + 0.4));
      return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + mau + '" stroke-width="2"/>' +
        '<polygon points="' + x2 + ',' + y2 + ' ' + p1 + ' ' + p2 + '" fill="' + mau + '"/>';
    }
    var s = '<svg viewBox="0 0 260 230" class="hinh hinh-nho" role="img" aria-label="Hình tam giác ' + 'A' + ten.Y + ten.X + '">';
    s += '<line x1="' + Mx + '" y1="' + My + '" x2="' + Mx + '" y2="' + By + '" stroke="#1d2b4f" stroke-width="1.5"/>';
    if (ten.dao) s += '<polyline points="' + Ax + ',' + (Ay - 10) + ' ' + (Ax + 10) + ',' + (Ay - 10) + ' ' + (Ax + 10) + ',' + Ay + '" fill="none" stroke="#1d2b4f" stroke-width="1.2"/>';
    else s += '<polyline points="' + (Mx - 10) + ',' + My + ' ' + (Mx - 10) + ',' + (My + 10) + ' ' + Mx + ',' + (My + 10) + '" fill="none" stroke="#1d2b4f" stroke-width="1.2"/>';
    if (ten.dao) { s += mui(Ax, Ay, Cx, Cy, '#1f3f8f'); s += mui(Cx, Cy, Mx, My, '#1f3f8f'); }
    else { s += mui(Ax, Ay, Cx, Cy, '#1f3f8f'); s += mui(Cx, Cy, Mx, My, '#1f3f8f'); }
    s += mui(Ax, Ay, Mx, My, '#b03a2e');
    s += '<circle cx="' + Ax + '" cy="' + Ay + '" r="3" fill="#1d2b4f"/><circle cx="' + Mx + '" cy="' + By + '" r="3" fill="#1d2b4f"/>';
    var nhan = 'font-size="15" font-style="italic" fill="#1d2b4f"';
    s += '<text x="' + (Ax - 5) + '" y="' + (Ay + 20) + '" ' + nhan + '>A</text>';
    s += '<text x="' + (Mx + 8) + '" y="' + (By + 5) + '" ' + nhan + '>B</text>';
    s += '<text x="' + (Mx + 8) + '" y="' + (My + 5) + '" ' + nhan + '>' + ten.X + '</text>';
    if (ten.dao) s += '<text x="' + (Cx + 6) + '" y="' + (Cy + 18) + '" ' + nhan + '>' + ten.Y + '</text>';
    else s += '<text x="' + (Cx - 18) + '" y="' + (Cy + 5) + '" ' + nhan + '>' + ten.Y + '</text>';
    // độ dài cạnh chỉ hiện khi học sinh đã điền đúng (hienDai[0]: |v1| = w, hienDai[1]: |v2| = u)
    var lw = '<text font-size="12.5" font-weight="bold" fill="#1f3f8f"', vw = ' stroke="#fff" stroke-width="4" paint-order="stroke"';
    if (ten.dao) {
      if (hienDai[1]) s += lw + vw + ' x="' + ((Ax + Cx) / 2 - 4) + '" y="' + (Ay + 18) + '">' + p.u + '</text>';
      if (hienDai[0]) s += lw + vw + ' x="' + ((Cx + Mx) / 2 + 8) + '" y="' + ((Cy + My) / 2 + 4) + '">' + p.w + '</text>';
    } else {
      if (hienDai[1]) s += lw + vw + ' x="' + ((Cx + Mx) / 2 - 4) + '" y="' + (My - 8) + '">' + p.u + '</text>';
      if (hienDai[0]) s += lw + vw + ' x="' + ((Ax + Cx) / 2 - 22) + '" y="' + ((Ay + Cy) / 2 + 4) + '">' + p.w + '</text>';
    }
    s += '</svg>';
    return s;
  }

  // st (không bắt buộc) = {gt, khoa, goiY}: bài đang làm của học sinh, để dựng tên điểm theo cách em tự đặt
  function dong(p, st) {
    var V = function (x) { return '\\overrightarrow{' + x + '}'; };
    var T = tenDiem(st), sq = function (x) { return x + '^2'; };
    var pt = [sq(T.S1) + '=' + sq(T.S) + '+' + sq(T.S2), sq(T.S) + '=' + sq(T.S1) + '+' + sq(T.S2), sq(T.S2) + '=' + sq(T.S1) + '+' + sq(T.S)];
    var thuTu = MT.tron([0, 1, 2], p.seed);
    var e0 = T.dao ? T.Y + T.X : 'A' + T.Y, e1 = T.dao ? 'A' + T.Y : T.Y + T.X;
    var oDai = [{ k: 'so', d: p.w, hien: '' + p.w }, { k: 'so', d: p.u, hien: '' + p.u }];
    function oVecto(e) { return { k: 'vectoTen', d: [e], hien: V(e), go: 'vt(' + e + ')', kiemTra: function (g) { return MT.docVectoTen(g) === e; } }; }
    function hienDai() {
      if (!st || !st.gt) return [true, true];
      if (st.goiY && st.goiY[6]) return [true, true];
      if (!st.khoa || !st.khoa[6]) return [false, false];
      return [0, 1].map(function (j) { return MT.chamO(oDai[j], st.gt[6] && st.gt[6][j]).dung; });
    }
    return [
      { t: 'Gọi $' + V('v_1') + '$ là vận tốc riêng của ca nô' },
      { t: '$' + V('v_2') + '$ là vận tốc dòng nước', thut: 1 },
      { t: '$' + V('v') + '=$ [[0]] là vận tốc thực của ca nô', thut: 1,
        o: [{ k: 'vecto', d: ['v1', 'v2'], hien: V('v_1') + '+' + V('v_2'), go: 'vt(v1)+vt(v2)' }] },
      { t: 'Dựng $' + V('v') + '=$ [[0]], cùng hướng với $' + V('AB') + '$',
        o: [{ k: 'vectoTen', d: [T.S], hien: V(T.S), go: 'vt(' + T.S + ')', kiemTra: function (g) { var x = MT.docVectoTen(g); return !!x && x[0] === 'A' && x[1] !== 'B'; } }] },
      { t: '$' + V('v_1') + '=$ [[0]], $' + V('v_2') + '=$ [[1]]', thut: 1, o: [oVecto(e0), oVecto(e1)],
        hinh: function (pp, cheDo) { return cheDo === 'lam' ? '' : hinhTamGiac(p, T, cheDo === 'loigiai' ? [true, true] : hienDai()); } },
      { t: 'Tam giác $A' + T.Y + T.X + '$ là tam giác vuông tại [[0]]',
        o: [{ k: 'chu', d: [T.dinh], hien: T.dinh, go: T.dinh, kiemTra: function (g) { return String(g).trim().toUpperCase() === T.dinh; } }] },
      { t: 'Có: $' + T.S1 + '=|' + V('v_1') + '|=$ [[0]], $' + T.S2 + '=|' + V('v_2') + '|=$ [[1]] (km/h)', o: oDai },
      { t: 'Theo định lý Pytago:' },
      { t: '[[0]]', thut: 1,
        o: [{ k: 'chon', chon: thuTu.map(function (i) { return pt[i]; }), d: thuTu.indexOf(0), hien: pt[0] }] },
      { t: '$\\Rightarrow ' + sq(T.S) + '=$ [[0]] $=$ [[1]] $=$ [[2]]', thut: 1,
        o: [{ k: 'bieuthucChu', d: [T.S1, T.S2], hien: sq(T.S1) + '-' + sq(T.S2), go: sq(T.S1) + '-' + sq(T.S2),
              kiemTra: function (g) {
                var m = /^([A-Z]{2})\^2-([A-Z]{2})\^2$/.exec(String(g).replace(/\s+/g, '').replace(/²/g, '^2').toUpperCase());
                return !!m && cungDoan(m[1], T.S1) && cungDoan(m[2], T.S2);
              } },
            { k: 'bieuthuc', d: p.am2, hien: p.w + '^2-' + p.u + '^2',
              kiemTra: function (g) { // phải thay số, không chỉ ghi kết quả
                var v; try { v = MT.tinh(MT.docBieuThuc(g)); } catch (e) { return { dung: false, lyDo: e.message }; }
                if (Math.abs(v - p.am2) > 1e-9) return false;
                var so = (String(g).match(/\d+/g) || []).map(Number);
                var thay = (so.indexOf(p.w) >= 0 && so.indexOf(p.u) >= 0) || (so.indexOf(p.w * p.w) >= 0 && so.indexOf(p.u * p.u) >= 0);
                return thay ? true : { dung: false, lyDo: 'Em cần thay số vào biểu thức' };
              } },
            { k: 'so', d: p.am2, hien: '' + p.am2 }] },
      { t: '$\\Rightarrow ' + T.S + '=$ [[0]]', thut: 1,
        o: [{ k: 'bieuthuc', d: p.a * Math.sqrt(p.b), hien: p.amTex }] },
      { t: 'Vận tốc thực của ca nô là $v=$ [[0]] (km/h)',
        o: [{ k: 'bieuthuc', d: p.a * Math.sqrt(p.b), hien: p.amTex }] },
      { t: 'Công thức quãng đường của chuyển động đều: $S=v.t$' },
      { t: '$\\Rightarrow t=$ [[0]] $=$ [[1]] $=$ [[2]] (h) $=$ [[3]] (phút) $\\approx$ [[4]] (phút)',
        o: [{ k: 'bieuthucChu', d: ['S', 'v'], hien: '\\dfrac{S}{v}', go: 'S/v',
              xemTruoc: function (g) { return /^\(?s\/v\)?$/i.test(String(g).replace(/\s+/g, '')) ? '\\dfrac{S}{v}' : null; },
              kiemTra: function (g) { return /^\(?s\/v\)?$/i.test(String(g).replace(/\s+/g, '')); } },
            { k: 'bieuthuc', d: p.d / (p.a * Math.sqrt(p.b)), hien: '\\dfrac{' + p.d + '}{' + p.amTex + '}', go: p.d + '/(' + p.a + 'can' + p.b + ')',
              kiemTra: function (g) { // thay số S và v, chưa cần trục căn ở ô này
                var v; try { v = MT.tinh(MT.docBieuThuc(g)); } catch (e) { return { dung: false, lyDo: e.message }; }
                if (!MT.bang(v, p.d / (p.a * Math.sqrt(p.b)))) return false;
                var so = (String(g).match(/\d+/g) || []).map(Number);
                return so.indexOf(p.d) >= 0 && so.indexOf(p.b) >= 0 ? true : { dung: false, lyDo: 'Em cần thay số S và v vào biểu thức' };
              } },
            { k: 'bieuthuc', d: 1 / Math.sqrt(p.b), hien: p.tGioTex, trucCan: true },
            { k: 'bieuthuc', d: p.tPhut, hien: p.tPhutTex, trucCan: true },
            { k: 'thapphan', d: p.t1, hien: MT.so(p.t1) }] },
      { t: 'Vậy thời gian ca nô đi từ $A$ đến $B$ là khoảng [[0]] phút.', o: [{ k: 'thapphan', d: p.t1, hien: MT.so(p.t1) }] }
    ];
  }

  /* ---------- Bài "Vượt KPI": mở khi Câu 1 đạt 100%. Chỉ điền đáp án từng ý, có gợi ý kiến thức mới ---------- */
  function soTien(g) { var x = String(g).replace(/[\s.]/g, '').replace(/đ(ồng)?$/i, ''); return /^\d+$/.test(x) ? Number(x) : NaN; }
  var CAU_KPI = {
    maCau: 'L10.C4.B8.D1.KPI1',
    ten: 'Vượt KPI',
    muc: 'Vận dụng',
    kpi: true,
    moKhi: 'L10.C4.B8.D1.C1',      // mở khi câu này đạt 100%
    cachCoDinh: 'day',             // chỉ điền đáp án theo từng ý (không có bài giải từng dòng)

      var g = Math.atan2(Q[1] - y0, Q[0] - x0), l = 16, P = [Q[0] - l * 0.8 * Math.cos(g), Q[1] - l * 0.8 * Math.sin(g)];
      return '<line x1="' + x0 + '" y1="' + y0 + '" x2="' + P[0] + '" y2="' + P[1] + '" stroke="' + mau + '" stroke-width="5" stroke-linecap="round"/>' +
        '<polygon points="' + Q[0] + ',' + Q[1] + ' ' + (Q[0] - l * Math.cos(g - 0.38)) + ',' + (Q[1] - l * Math.sin(g - 0.38)) + ' ' + (Q[0] - l * Math.cos(g + 0.38)) + ',' + (Q[1] - l * Math.sin(g + 0.38)) + '" fill="' + mau + '"/>';
    }
    function nhan(x, y, ten, mau) {
      return '<text x="' + x + '" y="' + y + '" font-family="Times New Roman, Liberation Serif, serif" font-size="22" font-style="italic" fill="' + mau + '">F' +
        (ten ? '<tspan font-size="15" dy="5">' + ten + '</tspan>' : '') + '</text>' +
        '<path d="M' + (x + 1) + ',' + (y - 20) + ' h15 m-4,-4 l4,4 l-4,4" fill="none" stroke="' + mau + '" stroke-width="1.5"/>';
    }
    var lam = '#1E6FD9', luc = '#2A9D4B', doF = '#EF5B5B', cam = '#F39C12';
    var s = '<svg viewBox="' + xL + ' ' + y1 + ' ' + (W - xL) + ' ' + (y0 + 44 - y1) + '" class="hinh" role="img" aria-label="Hai lực F1, F2 hợp với nhau góc ' + p.goc + ' độ và hợp lực F">';
    s += '<path d="M' + (x0 + rA) + ',' + y0 + ' A' + rA + ',' + rA + ' 0 0 0 ' + (x0 + rA * Math.cos(gr)) + ',' + (y0 - rA * Math.sin(gr)) + '" fill="none" stroke="' + cam + '" stroke-width="3"/>';
    s += '<text x="' + cn[0] + '" y="' + (cn[1] + 7) + '" text-anchor="middle" font-family="Times New Roman, Liberation Serif, serif" font-size="20" fill="' + cam + '" stroke="#fff" stroke-width="4" paint-order="stroke">' + p.goc + '°</text>';
    s += mui(C, doF) + mui(B, luc) + mui(A, lam);
    s += '<circle cx="' + x0 + '" cy="' + y0 + '" r="6" fill="#1B1F4B"/>';
    s += nhan(x0 + (A[0] - x0) * 0.5 - 8, y0 + 34, '1', lam);
    s += nhan(x0 + (B[0] - x0) * 0.5 - 38, y0 + (B[1] - y0) * 0.5 + 6, '2', luc);
    s += nhan(x0 + (C[0] - x0) * 0.62 + 4, y0 + (C[1] - y0) * 0.62 + 30, '', doF);
    s += '</svg>';
    return s;
  }

  /* --- ô có cách chấm riêng --- */
  function oChu(d) { return { k: 'chu', d: [d], hien: d, go: d, kiemTra: function (g) { return !!chu1(g); } }; }
  function oDoan(d, mu) { // đoạn thẳng (OA hay AO đều đúng), mu: có bình phương
    return { k: 'doan', d: [d], hien: d + (mu ? '^2' : ''), go: d + (mu ? '^2' : ''),
      xemTruoc: function (g) { var s = gon(g).replace(/²/g, '^2'); var m = /^([A-Z]{2})(\^2)?$/.exec(s); return m ? m[1] + (m[2] ? '^2' : '') : null; },
      kiemTra: function (g) {
        var s = gon(g).replace(/²/g, '^2');
        if (mu) { var m = /^([A-Z]{2})\^2$/.exec(s); return !!m && cungDoan(m[1], d); }
        return cungDoan(docDoan(s), d);
      } };
  }
  function oGoc(hien, kiemTra) {
    return { k: 'goc', d: [hien], hien: G(hien), go: 'goc(' + hien + ')', kiemTra: function (g) { return kiemTra(docGoc(g)); },
      xemTruoc: function (g) { var x = docGoc(g); return x ? G(x) : null; } };
  }
  function oGocHaySo(hien, kiemTra, soDo) { // thầy duyệt: ghi tên góc hay số đo của góc đều đúng
    return { k: 'goc', d: [hien], hien: G(hien), go: 'goc(' + hien + ')',
      kiemTra: function (g) {
        if (kiemTra(docGoc(g))) return true;
        try { return MT.bang(MT.tinh(MT.docBieuThuc(g)), soDo); } catch (e) { return false; }
      },
      xemTruoc: function (g) { var x = docGoc(g); if (x) return G(x); try { return MT.sangTex(MT.docBieuThuc(g)); } catch (e) { return null; } } };
  }
  var o180 = { k: 'bieuthuc', d: 180, hien: '180^\\circ', go: '180do' };
  function oSo(d) { return { k: 'so', d: d, hien: '' + d }; }

  // Biểu thức có cos: cos(120) (thầy quy ước: góc trong cos hiểu là độ), vẫn nhận cos120, cos(120do), cos120° -> thay bằng giá trị để chấm, hoặc để hiện lại đúng kí hiệu
  function reCos() { return /cos\s*(?:\(\s*(\d+(?:[.,]\d+)?)\s*(?:do|°)?\s*\)|(\d+(?:[.,]\d+)?)\s*(?:do|°)?)/gi; }
  function thayCos(g, cheDo) {
    var goc = [];
    var s = String(g == null ? '' : g).replace(reCos(), function (_, x, y) {
      var d = parseFloat(String(x || y).replace(',', '.')); goc.push(d);
      if (cheDo === 'hien') return '(987654' + (goc.length - 1) + ')';
      var c = Math.round(Math.cos(d * Math.PI / 180) * 1e12) / 1e12;
      return '(' + String(c).replace('.', ',') + ')';
    });
    return { s: s, goc: goc };
  }
  function xemCos(g) {
    var t = thayCos(g, 'hien');
    if (/cos/i.test(t.s)) return null;
    var x = MT.sangTex(MT.docBieuThuc(t.s));
    t.goc.forEach(function (d, i) { x = x.split('\\left(987654' + i + '\\right)').join('\\cos ' + MT.so(d) + '^\\circ'); });
    return x;
  }

  // st (không bắt buộc) = {gt, khoa, goiY}: bài đang làm của học sinh, để dựng tên điểm theo cách em tự đặt
  function dong(p, st) {
    var T = tenDiem(st), O = T.O, X = T.X, Y = T.Y, Z = T.Z;
    var hbh = O + X + Z + Y, vong = [];
    for (var r = 0; r < 4; r++) { var q = hbh.slice(r) + hbh.slice(0, r); vong.push(q, q.split('').reverse().join('')); }
    var Fc1 = T.ke === 'Y' ? p.F2 : p.F1, Fc2 = T.ke === 'Y' ? p.F1 : p.F2; // |c1|, |c2|
    var sq = function (x) { return x + '^2'; };
    var congThuc = sq(T.c1) + '+' + sq(T.c2) + '-2\\cdot ' + T.c1 + '\\cdot ' + T.c2 + '\\cdot\\cos' + G(T.K);
    var RE_CT = /^([A-Z]{2})\^2\+([A-Z]{2})\^2-2\.?([A-Z]{2})\.?([A-Z]{2})\.?COS\.?(.+)$/;
    function docCT(g) {
      var s = gon(g).replace(/²/g, '^2').replace(/[·*×∙]/g, '.').replace(/[−–—]/g, '-');
      var m = RE_CT.exec(s); if (!m) return null;
      var gk = m[5].replace(/^\((.*)\)$/, '$1'), goc = /^[A-Z]$/.test(gk) ? gk : docGoc(gk);
      return goc ? { c: [m[1], m[2], m[3], m[4]], goc: goc } : null;
    }
    function haiCanh(a, b) { return (cungDoan(a, T.c1) && cungDoan(b, T.c2)) || (cungDoan(a, T.c2) && cungDoan(b, T.c1)); }
    function laGocO(x) { return cungGoc(x, T.gocO); }
    function laGocKe(x) { return cungGoc(x, T.keX) || cungGoc(x, T.keY); }
    function laVectoTuO(g) { var v = MT.docVectoTen(g); return v && v[0] === O && v[1] !== O ? v : null; }
    var gt = st && st.gt;
    // Kết quả OC² (thầy dặn 27/11/2026): ra số nguyên thì ô số; có căn thì một ô dạng A+Bcan(C) hoặc A-Bcan(C), có chú thích nhỏ ở dưới
    var dongKetQua = '[[3]]', oKetQua = [oSo(p.OC2)];
    if (p.can) {
      if (!(st && st.khoa && st.khoa[D_TG + 1])) dongKetQua += '<br><span class="nho chu-thich">Điền dạng A+Bcan(C) hoặc A−Bcan(C), ví dụ: 8-2can(5)</span>';
      oKetQua = [{ k: 'bieuthuc', rong: 16, d: p.OC2, hien: p.hienOC2, go: p.goOC2,
        kiemTra: function (g) {
          var x = String(g == null ? '' : g).replace(/\s+/g, '').replace(/√/g, 'can').replace(/−/g, '-').toLowerCase();
          var so = '\\d+(?:[.,]\\d+)?', can = '(?:' + so + ')?[.*·×]?can\\(?' + so + '\\)?';
          if (!new RegExp('^(?:' + so + '[+-]' + can + '|' + can + '[+-]' + so + ')$').test(x)) return { dung: false, lyDo: 'Em điền dạng A+Bcan(C), ví dụ 8-2can(5)' };
          var v; try { v = MT.tinh(MT.docBieuThuc(x)); } catch (e) { return { dung: false, lyDo: e.message }; }
          return MT.bang(v, p.OC2);
        } }];
    }
    var oF1 = oSo(p.F1), oF2 = oSo(p.F2), oGocO = { k: 'bieuthuc', d: p.goc, hien: p.goc + '^\\circ', go: p.goc + 'do' };
    function hienHinh() { // hình đang làm bài: chỉ hiện những gì em đã điền đúng
      if (!st || !st.gt) return { O: true, XY: true, Z: true, goc: true, d1: true, d2: true };
      var mo = function (i) { return !!(st.goiY && st.goiY[i]); }, xong = function (i) { return !!(st.khoa && st.khoa[i]); };
      function dungO(i, j, o) { return mo(i) || (xong(i) && MT.chamO(o, gt[i] && gt[i][j]).dung); }
      return { O: mo(D_DAT) || (xong(D_DAT) && T.dung.O), XY: mo(D_DUNG) || (xong(D_DUNG) && T.dung.XY),
        Z: mo(D_HOP) || (xong(D_HOP) && T.dung.Z), goc: dungO(D_GOC, 0, oGocO), d1: dungO(D_F, 0, oF1), d2: dungO(D_F, 1, oF2) };
    }
    var DAY_DU = { O: true, XY: true, Z: true, goc: true, d1: true, d2: true, bbh: true };
    var xongHop = !!(st && st.khoa && st.khoa[D_HOP]);
    return [
      { t: 'Đặt vật tại điểm [[0]]', o: [oChu(O)] },
      { t: 'Dựng hình: $' + V('F_1') + '=$ [[0]]; $' + V('F_2') + '=$ [[1]]',
        o: [{ k: 'vectoTen', d: [O + X], hien: V(O + X), go: 'vt(' + O + X + ')', kiemTra: function (g) { return !!laVectoTuO(g); } },
            { k: 'vectoTen', d: [O + Y], hien: V(O + Y), go: 'vt(' + O + Y + ')',
              kiemTra: function (g) { var v = laVectoTuO(g), v0 = laVectoTuO(gt && gt[D_DUNG] && gt[D_DUNG][0]); return !!v && !(v0 && v0[1] === v[1]); } }],
        hinh: function (pp, cheDo) { // hai vectơ vừa dựng (khi chưa xong dòng Hợp lực)
          if (cheDo === 'lam' || cheDo === 'loigiai' || xongHop) return '';
          var h = hienHinh(); h.bbh = false; return hinhBBH(p, T, h);
        } },
      { t: '$' + G(T.gocO) + '=$ [[0]]', thut: 1, o: [oGocO] },
      { t: 'Hợp lực $' + V('F') + '=$ [[0]] $=$ [[1]] $=$ [[2]], với [[3]] là hình bình hành',
        o: [{ k: 'vecto', d: ['f1', 'f2'], hien: V('F_1') + '+' + V('F_2'), go: 'vt(F1)+vt(F2)' },
            { k: 'vectoTen', d: [O + X, O + Y], hien: V(O + X) + '+' + V(O + Y), go: 'vt(' + O + X + ')+vt(' + O + Y + ')',
              xemTruoc: function (g) { var t = docTong(g); return t ? V(t[0]) + '+' + V(t[1]) : null; },
              kiemTra: function (g) { var t = docTong(g); return !!t && t.slice().sort().join() === [O + X, O + Y].sort().join(); } },
            { k: 'vectoTen', d: [O + Z], hien: V(O + Z), go: 'vt(' + O + Z + ')', kiemTra: function (g) { return MT.docVectoTen(g) === O + Z; } },
            { k: 'hbh', d: [hbh], hien: hbh, go: hbh, xemTruoc: function (g) { var s = gon(g); return /^[A-Z]{4}$/.test(s) ? s : null; },
              kiemTra: function (g) { return vong.indexOf(gon(g)) >= 0; } }],
        hinh: function (pp, cheDo) {
          if (cheDo === 'loigiai') return hinhBBH(p, T, DAY_DU);
          if (cheDo === 'lam' || !xongHop) return '';
          var h = hienHinh(); h.bbh = true; return hinhBBH(p, T, h);
        } },
      // hai dòng độ lớn lực hiện cùng lúc, điền xong chốt cả hai; tên cạnh theo hình bình hành em dựng
      { t: '$|' + V('F_1') + '|=' + O + X + '=$ [[0]] (N)<br>$|' + V('F_2') + '|=' + O + Y + '=$ [[1]] (N)', o: [oF1, oF2] },
      { t: 'Ta có: [[0]] $+$ [[1]] $=$ [[2]] (hai góc kề một cạnh của hình bình hành thì bù nhau)',
        o: [oGoc(T.gocO, function (x) { return laGocO(x) || laGocKe(x); }),
            oGoc(T.K, function (x) {
              var g0 = docGoc(gt && gt[D_TACO] && gt[D_TACO][0]);
              if (laGocO(g0)) return laGocKe(x);
              if (laGocKe(g0)) return laGocO(x);
              return laGocO(x) || laGocKe(x);
            }), o180] },
      { t: '$\\Rightarrow$ [[0]] $=$ [[1]] $-$ [[2]] $=$ [[3]]',
        o: [oGoc(T.K, function (x) { return cungGoc(x, T.K); }), o180, oGocHaySo(T.gocO, laGocO, p.goc), { k: 'bieuthuc', d: p.ke, hien: p.ke + '^\\circ', go: p.ke + 'do' }] },
      { t: 'Áp dụng định lý Côsin trong tam giác [[0]]:',
        o: [{ k: 'tamgiac', d: [T.tg], hien: T.tg, go: T.tg, xemTruoc: function (g) { var s = gon(g); return /^[A-Z]{3}$/.test(s) ? s : null; },
              kiemTra: function (g) { return cungTap(gon(g), T.tg); } }] },
      // một bước: dòng công thức, dòng thay số, kết quả tính (điền xong chốt cả ba)
      { t: '[[0]] $=$ [[1]]<br>$=$ [[2]]<br>$\\Rightarrow ' + O + Z + '^2=$ ' + dongKetQua, thut: 1, vuaHang: true,
        o: [oDoan(O + Z, true),
            { k: 'bieuthucChu', rong: 30, d: [T.c1, T.c2, T.K], hien: congThuc, go: T.c1 + '^2+' + T.c2 + '^2-2.' + T.c1 + '.' + T.c2 + '.cos(goc(' + T.K + '))',
              xemTruoc: function (g) {
                var m = docCT(g); if (!m) return null;
                return sq(m.c[0]) + '+' + sq(m.c[1]) + '-2\\cdot ' + m.c[2] + '\\cdot ' + m.c[3] + '\\cdot\\cos' + G(m.goc);
              },
              kiemTra: function (g) {
                var m = docCT(g); if (!m) return false;
                var gocDung = m.goc.length === 1 ? m.goc === T.D : cungGoc(m.goc, T.K);
                return haiCanh(m.c[0], m.c[1]) && haiCanh(m.c[2], m.c[3]) && gocDung;
              } },
            { k: 'bieuthuc', rong: 30, d: p.OC2, hien: Fc1 + '^2+' + Fc2 + '^2-2\\cdot ' + Fc1 + '\\cdot ' + Fc2 + '\\cdot\\cos ' + p.ke + '^\\circ',
              go: Fc1 + '^2+' + Fc2 + '^2-2.' + Fc1 + '.' + Fc2 + '.cos(' + p.ke + ')',
              xemTruoc: xemCos,
              kiemTra: function (g) { // phải thay số |F1|, |F2| và cos(góc kề), không chỉ ghi kết quả
                var t = thayCos(g), v;
                try { v = MT.tinh(MT.docBieuThuc(t.s)); } catch (e) { return { dung: false, lyDo: e.message }; }
                if (!MT.bang(v, p.OC2)) return false;
                var so = (String(g).replace(reCos(), ' ').match(/\d+/g) || []).map(Number);
                var co = function (F) { return so.indexOf(F) >= 0 || so.indexOf(F * F) >= 0; };
                return co(p.F1) && co(p.F2) && t.goc.length ? true : { dung: false, lyDo: 'Em cần thay số vào công thức (có cả cos của góc)' };
              } },
            ].concat(oKetQua) },
      // tên cạnh ghi sẵn theo dòng trên; OC² có căn (30°, 45°) thì chỉ điền giá trị xấp xỉ (thầy dặn 27/11/2026)
      p.can ? { t: '$\\Rightarrow ' + O + Z + '\\approx$ [[0]]', o: [oSo(p.tron)] }
            : { t: '$\\Rightarrow ' + O + Z + '=$ [[0]] $\\approx$ [[1]]', o: [{ k: 'bieuthuc', d: p.OC, hien: '\\sqrt{' + p.OC2 + '}', go: 'can' + p.OC2 }, oSo(p.tron)] },
      { t: 'Do $|' + V('F') + '|=$ [[0]] $\\approx$ [[1]]', o: [oDoan(O + Z), oSo(p.tron)] },
      { t: 'Vậy độ lớn của hợp lực khoảng [[0]] (N).', o: [oSo(p.tron)] }
    ];
  }

  DANG_TOAN.push({
    lop: 10,
    chuong: 'Chương IV. Vectơ',
    bai: 'Bài 8. Tổng và hiệu của hai vectơ',
    maDang: 'L10.C4.B8.D2',
    tenDang: 'Bài toán thực tế: Tổng hợp lực',
    cau: [{
      maCau: 'L10.C4.B8.D2.C1',
      ten: 'Câu 1',
      muc: 'Vận dụng',
      chiDapAn: false,
      soBoSo: BO_SO.length,
      tao: tao,
      de: function (p) {
        return '<b>Bài toán hợp lực.</b> Người ta tác động cùng một lúc hai lực $' + V('F_1') + '$, $' + V('F_2') + '$ vào một vật (như hình vẽ). ' +
          'Biết góc giữa hai lực bằng $' + p.goc + '^\\circ$, $|' + V('F_1') + '|=' + p.F1 + '$ N, $|' + V('F_2') + '|=' + p.F2 + '$ N. ' +
          'Gọi vectơ hợp lực $' + V('F') + '$ là tổng của hai lực $' + V('F_1') + '$, $' + V('F_2') + '$. ' +
          'Tính độ lớn của vectơ hợp lực $' + V('F') + '$ theo đơn vị N <b>(làm tròn kết quả đến hàng đơn vị)</b>.';
      },
      hinhDe: hinhDe,
      dong: dong,
      dapAn: function (p) { return { k: 'so', d: p.tron, hien: '' + p.tron, donVi: 'N' }; }
    }]
  });
})();

window.DANG_TOAN = DANG_TOAN;
</script>

<script>
/* ============================================================
   ĐỀ ÔN TẬP KIỂM TRA (làm cả bộ đề, chấm theo thang điểm 2025)
   Mỗi đề là một khối DE_ON_TAP.push({...}).
   Mỗi câu có hàm tao(R) sinh số liệu theo mã đề (R là bộ số ngẫu nhiên có hạt giống),
   trả về một trong ba kiểu:
     { loai: 'tn', de, hinh, pa: [4 phương án], dung: vị trí đúng, giai }
     { loai: 'ds', de, hinh, y: [{ t, dung: true/false, giai } x4] }
     { loai: 'tl', de, hinh, da: số đáp án, hienDa: 'chuỗi', giai }
   kienThuc: kiến thức cần nhớ (hiện ở mục "Nội dung cần ôn tập"), ví dụ mẫu sinh từ chính câu đó với số liệu khác.
   ============================================================ */
var DE_ON_TAP = window.DE_ON_TAP || [];

var OTL = (function () {
  /* ---------- số ngẫu nhiên có hạt giống ---------- */
  function R(seed) {
    var s = Math.abs(Math.floor(seed)) % 2147483647; if (s <= 0) s += 2147483646;
    function n() { s = s * 16807 % 2147483647; return (s - 1) / 2147483646; }
    var r = {
      n: n,
      so: function (a, b) { return a + Math.floor(n() * (b - a + 1)); },
      soKhac0: function (a, b) { var x; do { x = r.so(a, b); } while (x === 0); return x; },
      chon: function (ds) { return ds[Math.floor(n() * ds.length)]; },
      tron: function (ds) { var a = ds.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(n() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; },
      tung: function () { return n() < 0.5; }
    };
    return r;
  }
  function ucln(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { var t = a % b; a = b; b = t; } return a || 1; }
  /* ---------- trình bày số ---------- */
  function ps(p, q) { // phân số tối giản dạng LaTeX
    if (q < 0) { p = -p; q = -q; }
    var g = ucln(p, q); p /= g; q /= g;

  function rutCan(n) { var a = 1, b = n; for (var k = Math.floor(Math.sqrt(n)); k >= 2; k--) if (b % (k * k) === 0) { a *= k; b /= k * k; } return [a, b]; }
  // giá trị p/q·√r (kèm chữ đuôi, ví dụ 'a') dạng LaTeX gọn: 5a\sqrt{2}, \dfrac{4\sqrt{6}}{3}, -12\sqrt{3}

(function () {

  /* ======================= PHẦN I ======================= */
  cau.push({ phan: 1, chuDe: 'Các phép toán trên tập hợp',
    kienThuc: '<ul><li>$A\\cap B$ (giao): các phần tử <b>vừa thuộc $A$ vừa thuộc $B$</b>.</li><li>$A\\cup B$ (hợp): các phần tử <b>thuộc $A$ hoặc thuộc $B$</b> (viết mỗi phần tử một lần).</li><li>$A\\setminus B$ (hiệu): các phần tử <b>thuộc $A$ nhưng không thuộc $B$</b>. Chú ý $A\\setminus B$ khác $B\\setminus A$.</li></ul>',

    tao: function (r) {

  cau.push({ phan: 1, chuDe: 'Định lí côsin: tính góc khi biết ba cạnh',

    tao: function (r) {

      var p = L.tronPA(r, '$\\vec u=' + vt(kq) + '$', ['$\\vec u=' + vt(nguoc) + '$'].concat(L.khacNhau(khac, 2).map(function (x) { return '$\\vec u=' + vt(x) + '$'; })));

  cau.push({ phan: 1, chuDe: 'Trọng tâm tam giác, trung điểm đoạn thẳng',

      }

  cau.push({ phan: 1, chuDe: 'Toạ độ trung điểm',
