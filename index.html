    tao: function (r) {
      var xA = r.so(-6, 7), yA = r.so(-6, 7), xB = xA + 2 * r.soKhac0(-4, 4), yB = yA + 2 * r.soKhac0(-4, 4);
      var xI = (xA + xB) / 2, yI = (yA + yB) / 2;
      var sai = L.khacNhau([td(xA + xB, yA + yB), td((xB - xA) / 2, (yB - yA) / 2), td(yI, xI), td(xA, yA), td(-xI, -yI)].filter(function (x) { return x !== td(xI, yI); }), 3);
      var p = L.tronPA(r, '$I' + td(xI, yI) + '$', sai.map(function (x) { return '$I' + x + '$'; }));
      return { loai: 'tn', de: 'Trong mặt phẳng toạ độ $Oxy$, cho hai điểm $A' + td(xA, yA) + '$ và $B' + td(xB, yB) + '$. Toạ độ trung điểm $I$ của đoạn thẳng $AB$ là', pa: p.pa, dung: p.dung,
        giai: '$x_I=\\dfrac{' + xA + '+' + ng(xB) + '}{2}=' + xI + '$, $y_I=\\dfrac{' + yA + '+' + ng(yB) + '}{2}=' + yI + '$. Vậy $I' + td(xI, yI) + '$.' };
    } });

  cau.push({ phan: 1, chuDe: 'Toạ độ của vectơ $m\\vec a\\pm n\\vec b$',
    kienThuc: '<ul><li>$\\vec a=(x_1;y_1)$, $\\vec b=(x_2;y_2)$ thì $\\vec a+\\vec b=(x_1+x_2;y_1+y_2)$, $\\vec a-\\vec b=(x_1-x_2;y_1-y_2)$, $k\\vec a=(kx_1;ky_1)$.</li><li>Tính từng hoành độ, từng tung độ riêng; cẩn thận dấu trừ trước số âm.</li></ul>',
    tao: function (r) {
      var x1 = r.soKhac0(-4, 4), y1 = r.soKhac0(-4, 4), x2 = r.soKhac0(-4, 4), y2 = r.soKhac0(-4, 4), m = r.so(2, 3), n = r.so(2, 3), tru = r.tung(), s = tru ? -1 : 1;
      var u = [m * x1 + s * n * x2, m * y1 + s * n * y2], kh = [m * x1 - s * n * x2, m * y1 - s * n * y2];
      var sai = L.khacNhau([td(kh[0], kh[1]), td(u[0], -u[1]), td(-u[0], -u[1]), td(-u[0], u[1])].filter(function (x) { return x !== td(u[0], u[1]); }), 3);
      var p = L.tronPA(r, '$' + td(u[0], u[1]) + '$', sai.map(function (x) { return '$' + x + '$'; }));
      return { loai: 'tn', de: 'Trong mặt phẳng toạ độ $Oxy$, cho hai vectơ $\\vec a=' + td(x1, y1) + '$ và $\\vec b=' + td(x2, y2) + '$. Toạ độ của vectơ $\\vec u=' + m + '\\vec a' + (tru ? '-' : '+') + n + '\\vec b$ là', pa: p.pa, dung: p.dung,
        giai: '$' + m + '\\vec a=' + td(m * x1, m * y1) + '$, $' + n + '\\vec b=' + td(n * x2, n * y2) + '$.<br>$\\vec u=(' + (m * x1) + (tru ? '-' : '+') + ng(n * x2) + ';' + (m * y1) + (tru ? '-' : '+') + ng(n * y2) + ')=' + td(u[0], u[1]) + '$.' };
    } });

  cau.push({ phan: 1, chuDe: 'Biểu thức toạ độ của tích vô hướng',
    kienThuc: '<ul><li>$\\vec a=(x_1;y_1)$, $\\vec b=(x_2;y_2)$ thì $\\vec a\\cdot\\vec b=x_1x_2+y_1y_2$ (nhân hoành với hoành, tung với tung rồi <b>cộng</b>).</li><li>$\\vec a\\perp\\vec b\\Leftrightarrow x_1x_2+y_1y_2=0$.</li></ul>',
    tao: function (r) {
      var x1 = r.soKhac0(-5, 5), y1 = r.soKhac0(-5, 5), x2 = r.soKhac0(-5, 5), y2 = r.soKhac0(-5, 5), d = x1 * x2 + y1 * y2;
      if (d === 0) throw new Error('lai');
      var sai = L.khacNhau([x1 * x2 - y1 * y2, -d, x1 * y2 + y1 * x2, d + 2 * (y1 * y2 || 1)].filter(function (x) { return x !== d; }).map(String), 3);
      var p = L.tronPA(r, '$' + d + '$', sai.map(function (x) { return '$' + x + '$'; }));
      return { loai: 'tn', de: 'Trong mặt phẳng toạ độ $Oxy$, cho hai vectơ $\\vec a=' + td(x1, y1) + '$ và $\\vec b=' + td(x2, y2) + '$. Tích vô hướng $\\vec a\\cdot\\vec b$ bằng', pa: p.pa, dung: p.dung,
        giai: '$\\vec a\\cdot\\vec b=' + x1 + '\\cdot ' + ng(x2) + '+' + ng(y1) + '\\cdot ' + ng(y2) + '=' + d + '$.' };
    } });

  cau.push({ phan: 1, chuDe: 'Định lí sin',
    kienThuc: '<ul><li>Định lí sin: $\\dfrac{BC}{\\sin A}=\\dfrac{AC}{\\sin B}=\\dfrac{AB}{\\sin C}=2R$ (mỗi cạnh đi với sin của góc <b>đối diện</b>).</li><li>$\\sin30^\\circ=\\dfrac12$, $\\sin45^\\circ=\\dfrac{\\sqrt2}{2}$, $\\sin60^\\circ=\\dfrac{\\sqrt3}{2}$, $\\sin(180^\\circ-\\alpha)=\\sin\\alpha$.</li></ul>',
    tao: function (r) {
      var cap = [[45, 60], [60, 45], [30, 45], [45, 30], [30, 60], [60, 30], [30, 135], [135, 30], [45, 120], [120, 45], [30, 120], [120, 30]];
      var g = r.chon(cap), A = g[0], B = g[1], k = r.so(2, 8), rA = SIN[A][2], rB = SIN[B][2];
      var dung = can(k, rA, rA * rB), nghich = can(k, rB, rA * rB), gap2 = can(2 * k, rA, rA * rB), nua = can(k, 2 * rA, rA * rB);
      var p = L.tronPA(r, '$' + dung + '$', ['$' + nghich + '$', '$' + gap2 + '$', '$' + nua + '$']);
      return { loai: 'tn', de: 'Cho tam giác $ABC$ có $BC=' + k + '$, $\\widehat A=' + A + '^\\circ$ và $\\widehat B=' + B + '^\\circ$. Độ dài cạnh $AC$ bằng', pa: p.pa, dung: p.dung,
        giai: 'Theo định lí sin: $\\dfrac{BC}{\\sin A}=\\dfrac{AC}{\\sin B}$ $\\Rightarrow$ $AC=\\dfrac{BC\\cdot\\sin B}{\\sin A}=\\dfrac{' + k + '\\cdot\\sin' + B + '^\\circ}{\\sin' + A + '^\\circ}=\\dfrac{' + k + '\\cdot ' + trig(SIN, B) + '}{' + trig(SIN, A) + '}=' + dung + '$.' };
    } });

  cau.push({ phan: 1, chuDe: 'Tích của một số với một vectơ',
    kienThuc: '<ul><li>$\\vec v=k\\vec u$ thì $|\\vec v|=|k|\\cdot|\\vec u|$; $k>0$: $\\vec v$ <b>cùng hướng</b> $\\vec u$, $k<0$: <b>ngược hướng</b>.</li><li>Trên lưới ô vuông, so sánh độ dài hai vectơ cùng phương bằng số ô theo một chiều (ngang hoặc dọc): $|k|=\\dfrac{|\\vec v|}{|\\vec u|}$.</li></ul>',
    tao: function (r) {
      var huong = r.chon([[2, 1], [1, 1], [3, 1], [1, 2], [2, -1], [1, -1], [3, -1]]), dx = huong[0], dy = huong[1], ady = Math.abs(dy), m, n, dem = 0;
      do { m = r.so(1, 4); n = r.so(1, 4); dem++; } while ((m === n || m * dx > 6 || n * dx > 5 || m * ady > 4 || n * ady > 4) && dem < 200);
      if (m === n || m * dx > 6 || n * dx > 5 || m * ady > 4 || n * ady > 4) throw new Error('lai');
      var cung = r.tung(), k = ps(cung ? n : -n, m), kn = ps(cung ? -n : n, m), d1 = ps(cung ? m : -m, n), d2 = ps(cung ? -m : m, n);
      var fmt = function (x) { return '$\\vec v=' + (x === '1' ? '' : x === '-1' ? '-' : x) + '\\vec u$'; };
      var p = L.tronPA(r, fmt(k), [fmt(kn), fmt(d1), fmt(d2)]);
      // hình lưới 14 x 6 ô
      var o = 30, W = 14 * o, H = 6 * o, s = '<svg viewBox="0 0 ' + (W + 2) + ' ' + (H + 2) + '" class="hinh" role="img" aria-label="Hai vectơ u và v trên lưới ô vuông">' + L.muiTen('mt-luoi', '#111') + '<g transform="translate(1,1)">';
      for (var i = 0; i <= 14; i++) s += '<line x1="' + i * o + '" y1="0" x2="' + i * o + '" y2="' + H + '" stroke="#bbb" stroke-width="1"/>';
      for (var j = 0; j <= 6; j++) s += '<line x1="0" y1="' + j * o + '" x2="' + W + '" y2="' + j * o + '" stroke="#bbb" stroke-width="1"/>';
      var P = function (x, y) { return [x * o, H - y * o]; }, y0 = dy > 0 ? 1 : 5;
      var u1 = P(1, y0), u2 = P(1 + m * dx, y0 + m * dy), vA = P(8, y0), vB = P(8 + n * dx, y0 + n * dy), v1 = cung ? vA : vB, v2 = cung ? vB : vA;
      var duong = function (a, b, ten) {
        var mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2, len = Math.hypot(b[0] - a[0], b[1] - a[1]), nx = -(b[1] - a[1]) / len, ny = (b[0] - a[0]) / len;
        if (ny > 0) { nx = -nx; ny = -ny; }
        return '<line x1="' + a[0] + '" y1="' + a[1] + '" x2="' + b[0] + '" y2="' + b[1] + '" stroke="#111" stroke-width="3" marker-end="url(#mt-luoi)"/><circle cx="' + a[0] + '" cy="' + a[1] + '" r="4.5" fill="#111"/>' +
          L.chu(mx + nx * 18, my + ny * 18 + 7, ten + '<tspan font-size="14" dx="-11" dy="-14">→</tspan>', 22);
      };
      s += duong(u1, u2, 'u') + duong(v1, v2, 'v') + '</g></svg>';
      var soO = function (t) { return Math.abs(t * dx) + ' ô ngang' + (ady ? ', ' + t * ady + ' ô dọc' : ''); };
      return { loai: 'tn', de: 'Cho hai vectơ $\\vec u$, $\\vec v$ trong hình sau. Đẳng thức nào sau đây <b>đúng</b>?', hinh: s, pa: p.pa, dung: p.dung,
        giai: '$\\vec u$ đi ' + soO(m) + '; $\\vec v$ đi ' + soO(n) + ' nên $|\\vec v|=' + ps(n, m) + '|\\vec u|$. Hai vectơ <b>' + (cung ? 'cùng hướng' : 'ngược hướng') + '</b> nên ' + fmt(k) + '.' };
    } });

  cau.push({ phan: 1, chuDe: 'Tích vô hướng theo định nghĩa',
    kienThuc: '<ul><li>$' + vt('AB') + '\\cdot' + vt('AC') + '=AB\\cdot AC\\cdot\\cos\\widehat{BAC}$ (hai vectơ <b>chung điểm đầu</b> thì góc giữa chúng là góc của tam giác).</li><li>$\\cos120^\\circ=-\\dfrac12$, $\\cos135^\\circ=-\\dfrac{\\sqrt2}{2}$, $\\cos150^\\circ=-\\dfrac{\\sqrt3}{2}$: góc tù thì tích vô hướng âm.</li></ul>',
    tao: function (r) {
      var A = r.chon([30, 45, 60, 120, 135, 150]), b = r.so(2, 8), c = r.so(2, 8);
      if (b === c || (b * c) % 2) throw new Error('lai');
      var C = COS[A], S = SIN[A], dung = can(C[0] * b * c, C[1], C[2]);
      var sai = L.khacNhau([can(-C[0] * b * c, C[1], C[2]), can(S[0] * b * c, S[1], S[2]), String(b * c), can(2 * C[0] * b * c, C[1], C[2])].filter(function (x) { return x !== dung; }), 3);
      var p = L.tronPA(r, '$' + dung + '$', sai.map(function (x) { return '$' + x + '$'; }));
      return { loai: 'tn', de: 'Cho tam giác $ABC$ có $AB=' + c + '$, $AC=' + b + '$ và $\\widehat A=' + A + '^\\circ$. Tích vô hướng $' + vt('AB') + '\\cdot' + vt('AC') + '$ bằng', pa: p.pa, dung: p.dung,
        giai: '$' + vt('AB') + '\\cdot' + vt('AC') + '=AB\\cdot AC\\cdot\\cos A=' + c + '\\cdot ' + b + '\\cdot\\cos' + A + '^\\circ=' + (b * c) + '\\cdot\\left(' + trig(COS, A) + '\\right)=' + dung + '$.' };
    } });

  /* ======================= PHẦN II ======================= */
  function chonDS(r, ds) { // mỗi ý: [phát biểu đúng, phát biểu sai, lời giải]; chọn ngẫu nhiên đúng/sai, không để cả 4 ý cùng loại
    var chon = ds.map(function () { return r.tung(); });
    if (chon.every(Boolean) || !chon.some(Boolean)) chon[r.so(0, 3)] = !chon[0];
    return ds.map(function (y, i) { return { t: chon[i] ? y[0] : y[1], dung: chon[i], giai: y[2] }; });
  }
  cau.push({ phan: 2, chuDe: 'Giao, hợp, hiệu của các khoảng, đoạn, nửa khoảng',
    kienThuc: '<ul><li>Biểu diễn hai tập trên cùng một trục số rồi đọc kết quả. Dấu ngoặc vuông $[\\;]$: lấy đầu mút; ngoặc tròn $(\\;)$: không lấy.</li><li>$A\\cap B$: phần chung; $A\\cup B$: gộp lại; $A\\setminus B$: phần của $A$ bỏ đi phần thuộc $B$.</li><li>Khi bỏ đi tập $B$, đầu mút nào $B$ <b>lấy</b> thì $A\\setminus B$ <b>không lấy</b> và ngược lại.</li></ul>',
    tao: function (r) {
      var a = r.so(-9, 0), c = a + r.so(2, 6), b = c + r.so(1, 5), d = b + r.so(2, 7);
      var la = r.tung(), ra = !la || r.tung(), lc = r.tung(), rd = r.tung(), D = L.doanSo;
      var I = [c, b, lc, ra], U = [a, d, la, rd], AB = [a, c, la, !lc], BA = [b, d, !ra, rd];
      var dat = function (x, latTrai) { return D(x[0], x[1], latTrai ? !x[2] : x[2], latTrai ? x[3] : !x[3]); };
      var y = chonDS(r, [
        ['$A\\cap B=' + D.apply(null, I) + '$', '$A\\cap B=' + dat(I, r.tung()) + '$', '$A\\cap B=' + D.apply(null, I) + '$ (phần chung của hai tập trên trục số).'],
        ['$A\\cup B=' + D.apply(null, U) + '$', '$A\\cup B=' + dat(U, true) + '$', '$A\\cup B=' + D.apply(null, U) + '$.'],
        ['$A\\setminus B=' + D.apply(null, AB) + '$', '$A\\setminus B=' + dat(AB, false) + '$', '$A\\setminus B=' + D.apply(null, AB) + '$ (bỏ khỏi $A$ phần từ $' + c + '$ trở đi; $B$ ' + (lc ? 'lấy' : 'không lấy') + ' $' + c + '$ nên $A\\setminus B$ ' + (lc ? 'không lấy' : 'lấy') + ' $' + c + '$).'],
        ['$B\\setminus A=' + D.apply(null, BA) + '$', '$B\\setminus A=' + dat(BA, true) + '$', '$B\\setminus A=' + D.apply(null, BA) + '$ ($A$ ' + (ra ? 'lấy' : 'không lấy') + ' $' + b + '$ nên $B\\setminus A$ ' + (ra ? 'không lấy' : 'lấy') + ' $' + b + '$).']
      ]);
      return { loai: 'ds', de: 'Cho hai tập hợp $A=' + D(a, b, la, ra) + '$ và $B=' + D(c, d, lc, rd) + '$. Xét tính Đúng – Sai trong các khẳng định sau.', y: y };
    } });

  cau.push({ phan: 2, chuDe: 'Tổng, hiệu vectơ trong hình chữ nhật',
    kienThuc: '<ul><li>Quy tắc hình bình hành: $ABCD$ là hình bình hành thì $' + vt('AB') + '+' + vt('AD') + '=' + vt('AC') + '$.</li><li>Quy tắc hiệu: $' + vt('AB') + '-' + vt('AD') + '=' + vt('DB') + '$.</li><li>Hình chữ nhật: hai đường chéo bằng nhau, $AC=\\sqrt{AB^2+AD^2}$.</li><li>$M$ là trung điểm $CD$ thì $' + vt('AM') + '=\\dfrac12(' + vt('AC') + '+' + vt('AD') + ')$ và $' + vt('DM') + '=' + vt('MC') + '$.</li></ul>',
    tao: function (r) {
      var t = r.chon(PYTAGO.slice(0, 5)), sw = r.tung(), p = sw ? t[1] : t[0], q = sw ? t[0] : t[1], dc = t[2];
      var yc = r.tung() ? ['$' + vt('AM') + '=\\dfrac12\\left(' + vt('AC') + '+' + vt('AD') + '\\right)$', '$' + vt('AM') + '=\\dfrac12\\left(' + vt('AC') + '+' + vt('AB') + '\\right)$']
        : ['$' + vt('AM') + '=' + vt('AD') + '+\\dfrac12' + vt('AB') + '$', '$' + vt('AM') + '=' + vt('AB') + '+\\dfrac12' + vt('AD') + '$'];
      var y = chonDS(r, [
        ['$\\left|' + vt('AC') + '\\right|=' + dc + 'a$', '$\\left|' + vt('AC') + '\\right|=' + (p + q) + 'a$', '$\\left|' + vt('AC') + '\\right|=AC=\\sqrt{AB^2+BC^2}=\\sqrt{(' + p + 'a)^2+(' + q + 'a)^2}=' + dc + 'a$.'],
        ['$\\left|' + vt('AB') + '-' + vt('AD') + '\\right|=' + dc + 'a$', '$\\left|' + vt('AB') + '-' + vt('AD') + '\\right|=' + Math.abs(p - q) + (Math.abs(p - q) === 1 ? '' : '') + 'a$', '$' + vt('AB') + '-' + vt('AD') + '=' + vt('DB') + '$ nên $\\left|' + vt('AB') + '-' + vt('AD') + '\\right|=BD=AC=' + dc + 'a$.'],
        [yc[0], yc[1], '$M$ là trung điểm $CD$: $' + vt('AM') + '=\\dfrac12\\left(' + vt('AC') + '+' + vt('AD') + '\\right)$; cũng có $' + vt('AM') + '=' + vt('AD') + '+' + vt('DM') + '=' + vt('AD') + '+\\dfrac12' + vt('AB') + '$.'],
        ['$' + vt('AM') + '-' + vt('AD') + '=' + vt('BC') + '-' + vt('BM') + '$', '$' + vt('AM') + '-' + vt('AD') + '=' + vt('BM') + '-' + vt('BC') + '$', '$' + vt('AM') + '-' + vt('AD') + '=' + vt('DM') + '$; $' + vt('BC') + '-' + vt('BM') + '=' + vt('MC') + '$; $' + vt('BM') + '-' + vt('BC') + '=' + vt('CM') + '$. Vì $' + vt('DM') + '=' + vt('MC') + '$ nên chỉ đẳng thức với $' + vt('BC') + '-' + vt('BM') + '$ là đúng.']
      ]);
      return { loai: 'ds', de: 'Cho hình chữ nhật $ABCD$ có $AB=' + p + 'a$ và $AD=' + q + 'a$. Gọi $M$ là trung điểm của cạnh $CD$. Xét tính Đúng – Sai trong các khẳng định sau.', y: y };
    } });

  cau.push({ phan: 2, chuDe: 'Toạ độ vectơ, trọng tâm, tích vô hướng, hình bình hành',
    kienThuc: '<ul><li>$' + vt('AB') + '=(x_B-x_A;y_B-y_A)$ (điểm cuối trừ điểm đầu).</li><li>Trọng tâm: $G\\left(\\dfrac{x_A+x_B+x_C}{3};\\dfrac{y_A+y_B+y_C}{3}\\right)$.</li><li>$\\vec a\\cdot\\vec b=x_1x_2+y_1y_2$.</li><li>$ABCD$ là hình bình hành $\\Leftrightarrow$ $' + vt('AD') + '=' + vt('BC') + '$ $\\Leftrightarrow$ $x_D=x_A+x_C-x_B$, $y_D=y_A+y_C-y_B$.</li></ul>',
    tao: function (r) {
      var xA = r.so(-5, 6), yA = r.so(-5, 6), xB = r.so(-5, 6), yB = r.so(-5, 6), xC = r.so(-5, 6), yC = r.so(-5, 6);
      var u = [xB - xA, yB - yA], v = [xC - xA, yC - yA];
      if (u[0] * v[1] - u[1] * v[0] === 0 || u[0] === 0) throw new Error('lai');
      var sx = xA + xB + xC, sy = yA + yB + yC, tich = u[0] * v[0] + u[1] * v[1], tichSai = u[0] * v[0] - u[1] * v[1];
      if (tichSai === tich) tichSai = tich + 2;
      if (sx === 0 && sy === 0) throw new Error('lai');
      var G = '\\left(' + ps(sx, 3) + ';' + ps(sy, 3) + '\\right)', Gs = '\\left(' + ps(sx, 2) + ';' + ps(sy, 2) + '\\right)';
      if (G === Gs) throw new Error('lai');
      var D = [xA + xC - xB, yA + yC - yB], Ds = [xB + xC - xA, yB + yC - yA];
      var y = chonDS(r, [
        ['$' + vt('AB') + '=' + td(u[0], u[1]) + '$', '$' + vt('AB') + '=' + td(-u[0], u[1]) + '$', '$' + vt('AB') + '=(' + xB + '-' + ng(xA) + ';' + yB + '-' + ng(yA) + ')=' + td(u[0], u[1]) + '$.'],
        ['Trọng tâm của tam giác $ABC$ là $G' + G + '$.', 'Trọng tâm của tam giác $ABC$ là $G' + Gs + '$.', '$x_G=\\dfrac{' + xA + '+' + ng(xB) + '+' + ng(xC) + '}{3}=' + ps(sx, 3) + '$, $y_G=\\dfrac{' + yA + '+' + ng(yB) + '+' + ng(yC) + '}{3}=' + ps(sy, 3) + '$.'],
        ['$' + vt('AB') + '\\cdot' + vt('AC') + '=' + tich + '$', '$' + vt('AB') + '\\cdot' + vt('AC') + '=' + tichSai + '$', '$' + vt('AC') + '=' + td(v[0], v[1]) + '$, $' + vt('AB') + '\\cdot' + vt('AC') + '=' + u[0] + '\\cdot ' + ng(v[0]) + '+' + ng(u[1]) + '\\cdot ' + ng(v[1]) + '=' + tich + '$.'],
        ['Với $D' + td(D[0], D[1]) + '$ thì tứ giác $ABCD$ là hình bình hành.', 'Với $D' + td(Ds[0], Ds[1]) + '$ thì tứ giác $ABCD$ là hình bình hành.', '$ABCD$ là hình bình hành $\\Leftrightarrow' + vt('AD') + '=' + vt('BC') + '=' + td(xC - xB, yC - yB) + '$ $\\Rightarrow D' + td(D[0], D[1]) + '$.']
      ]);
      return { loai: 'ds', de: 'Trong mặt phẳng toạ độ $Oxy$, cho ba điểm $A' + td(xA, yA) + '$, $B' + td(xB, yB) + '$ và $C' + td(xC, yC) + '$. Xét tính Đúng – Sai trong các khẳng định sau.', y: y };
    } });

  cau.push({ phan: 2, chuDe: 'Giải tam giác: định lí côsin, sin, diện tích, bán kính',
    kienThuc: '<ul><li>$a^2=b^2+c^2-2bc\\cos A$; $\\cos C=\\dfrac{a^2+b^2-c^2}{2ab}$.</li><li>Diện tích $S=\\dfrac12 bc\\sin A$.</li><li>Định lí sin: $\\dfrac{a}{\\sin A}=2R$ $\\Rightarrow$ $R=\\dfrac{a}{2\\sin A}$.</li><li>Tính góc: bấm máy $\\cos^{-1}$ rồi làm tròn theo yêu cầu.</li></ul>',
    tao: function (r) {
      var A = r.tung() ? 60 : 120, t = r.chon(A === 60 ? BO60 : BO120), b = t[0], c = t[1], a = t[2];
      var gC = Math.acos((a * a + b * b - c * c) / (2 * a * b)) / L.sin(90) * 180 / Math.PI, gB = 180 - A - gC;
      var hoiC = r.tung(), g = hoiC ? gC : gB, gk = hoiC ? gB : gC, ten = hoiC ? 'C' : 'B';
      if (L.ganNuaDV(g, 1) || Math.round(g) === Math.round(gk)) throw new Error('lai');
      var sai2 = A === 60 ? b * b + c * c + b * c : b * b + c * c - b * c;
      var cosG = hoiC ? [a * a + b * b - c * c, 2 * a * b, 'BC^2+AC^2-AB^2', '2\\cdot BC\\cdot AC', a + '^2+' + b + '^2-' + c + '^2', '2\\cdot ' + a + '\\cdot ' + b]
        : [a * a + c * c - b * b, 2 * a * c, 'BC^2+AB^2-AC^2', '2\\cdot BC\\cdot AB', a + '^2+' + c + '^2-' + b + '^2', '2\\cdot ' + a + '\\cdot ' + c];
      var y = chonDS(r, [
        ['$BC=' + a + '$', '$BC=' + can(1, 1, sai2) + '$', '$BC^2=AB^2+AC^2-2\\cdot AB\\cdot AC\\cdot\\cos A=' + c + '^2+' + b + '^2-2\\cdot ' + c + '\\cdot ' + b + '\\cdot\\cos' + A + '^\\circ=' + (a * a) + '$ $\\Rightarrow BC=' + a + '$.'],
        ['Số đo góc $\\widehat ' + ten + '$ (làm tròn đến hàng đơn vị) bằng $' + Math.round(g) + '^\\circ$.', 'Số đo góc $\\widehat ' + ten + '$ (làm tròn đến hàng đơn vị) bằng $' + Math.round(gk) + '^\\circ$.',
          '$\\cos ' + ten + '=\\dfrac{' + cosG[2] + '}{' + cosG[3] + '}=\\dfrac{' + cosG[4] + '}{' + cosG[5] + '}=' + ps(cosG[0], cosG[1]) + '$ $\\Rightarrow\\widehat ' + ten + '\\approx' + L.soVN(g, 2) + '^\\circ\\approx' + Math.round(g) + '^\\circ$.'],
        ['Diện tích tam giác $ABC$ bằng $' + can(b * c, 4, 3) + '$.', 'Diện tích tam giác $ABC$ bằng $' + can(b * c, 2, 3) + '$.', '$S=\\dfrac12\\cdot AB\\cdot AC\\cdot\\sin A=\\dfrac12\\cdot ' + c + '\\cdot ' + b + '\\cdot\\dfrac{\\sqrt3}{2}=' + can(b * c, 4, 3) + '$.'],
        ['Bán kính đường tròn ngoại tiếp tam giác $ABC$ bằng $' + can(a, 3, 3) + '$.', 'Bán kính đường tròn ngoại tiếp tam giác $ABC$ bằng $' + can(2 * a, 3, 3) + '$.', '$R=\\dfrac{BC}{2\\sin A}=\\dfrac{' + a + '}{2\\cdot\\frac{\\sqrt3}{2}}=\\dfrac{' + a + '}{\\sqrt3}=' + can(a, 3, 3) + '$.']
      ]);
      return { loai: 'ds', de: 'Cho tam giác $ABC$ có $AB=' + c + '$, $AC=' + b + '$ và $\\widehat A=' + A + '^\\circ$. Xét tính Đúng – Sai trong các khẳng định sau.', y: y };
    } });

  /* ======================= PHẦN III ======================= */
  cau.push({ phan: 3, chuDe: 'Khoảng cách giữa hai điểm (toạ độ)',
    kienThuc: '<ul><li>$AB=\\left|' + vt('AB') + '\\right|=\\sqrt{(x_B-x_A)^2+(y_B-y_A)^2}$.</li><li>Trong bài toán thực tế có gắn hệ trục, đổi ra đơn vị theo đề (mỗi đơn vị trên trục là bao nhiêu km, m).</li></ul>',
    tao: function (r) {
      var t = r.chon(PYTAGO.slice(0, 5)), sw = r.tung(), dx = (sw ? t[1] : t[0]) * (r.tung() ? 1 : -1), dy = (sw ? t[0] : t[1]) * (r.tung() ? 1 : -1);
      var xS = r.so(-9, 6), yS = r.so(-9, 6), xT = xS + dx, yT = yS + dy;
      var bc = r.chon([['Một chiếc cáp treo chạy thẳng từ ga', 'đến ga', 'quãng đường cáp treo', 'km'], ['Một đường dây điện được kéo thẳng từ trạm', 'đến trạm', 'đường dây điện', 'km'], ['Một chiếc flycam bay thẳng từ điểm', 'đến điểm', 'quãng đường flycam bay', 'km']]);
      return { loai: 'tl', de: 'Trên bản đồ một khu du lịch được gắn hệ trục toạ độ $Oxy$ (đơn vị trên mỗi trục là ' + bc[3] + '). ' + bc[0] + ' $S' + td(xS, yS) + '$ ' + bc[1] + ' $T' + td(xT, yT) + '$. Tính độ dài ' + bc[2] + ' (đơn vị: ' + bc[3] + ').',
        da: t[2], hienDa: String(t[2]),
        giai: '$ST=\\sqrt{(x_T-x_S)^2+(y_T-y_S)^2}=\\sqrt{(' + xT + '-' + ng(xS) + ')^2+(' + yT + '-' + ng(yS) + ')^2}=\\sqrt{' + (dx * dx) + '+' + (dy * dy) + '}=' + t[2] + '$ (' + bc[3] + ').' };
    } });

  cau.push({ phan: 3, chuDe: 'Định lí côsin trong bài toán thực tế',
    kienThuc: '<ul><li>Biết hai cạnh và góc xen giữa: $a^2=b^2+c^2-2bc\\cos A$.</li><li>$\\cos120^\\circ=-\\dfrac12$ nên với góc $120^\\circ$: $a^2=b^2+c^2+bc$; với góc $60^\\circ$: $a^2=b^2+c^2-bc$.</li></ul>',
    tao: function (r) {
      var A = r.tung() ? 120 : 60, t = r.chon(A === 60 ? BO60 : BO120), b = t[1], c = t[0], a = t[2];
      var dd = r.chon([['Thư viện', 'sân vận động'], ['Trường học', 'bệnh viện'], ['Nhà văn hoá', 'công viên']]);
      // hình: A ở gốc, AB theo hướng 200°, AC theo hướng 200° - A (giữ góc đúng)
      var g2 = A === 120 ? 20 : 5, g1 = g2 + A, lb = 100 + 70 * b / Math.max(b, c), lc = 100 + 70 * c / Math.max(b, c); // hình minh hoạ, độ dài gần đúng tỉ lệ
      var Ax = 0, Ay = 0, Bx = Ax + lb * L.cos(g1), By = Ay - lb * L.sin(g1), Cx = Ax + lc * L.cos(g2), Cy = Ay - lc * L.sin(g2);
      var xs = [Ax, Bx, Cx], ys = [Ay, By, Cy], x0 = Math.min.apply(null, xs) - 46, x1 = Math.max.apply(null, xs) + 46, y0 = Math.min.apply(null, ys) - 40, y1 = Math.max.apply(null, ys) + 40;
      var s = '<svg viewBox="' + x0.toFixed(0) + ' ' + y0.toFixed(0) + ' ' + (x1 - x0).toFixed(0) + ' ' + (y1 - y0).toFixed(0) + '" class="hinh hinh-nho" style="max-width:340px" role="img" aria-label="Hai con đường từ ngã ba A">' +
        '<line x1="' + Ax + '" y1="' + Ay + '" x2="' + (Ax + 1.25 * (Bx - Ax)).toFixed(1) + '" y2="' + (Ay + 1.25 * (By - Ay)).toFixed(1) + '" stroke="#c9b48a" stroke-width="14" stroke-linecap="round"/>' +
        '<line x1="' + Ax + '" y1="' + Ay + '" x2="' + (Ax + 1.25 * (Cx - Ax)).toFixed(1) + '" y2="' + (Ay + 1.25 * (Cy - Ay)).toFixed(1) + '" stroke="#c9b48a" stroke-width="14" stroke-linecap="round"/>' +
        '<line x1="' + Bx.toFixed(1) + '" y1="' + By.toFixed(1) + '" x2="' + Cx.toFixed(1) + '" y2="' + Cy.toFixed(1) + '" stroke="#1f6fd1" stroke-width="2" stroke-dasharray="6 5"/>' +
        L.cungGoc(Ax, Ay, 26, g2, g1) + L.chu(Ax + 44 * L.cos((g1 + g2) / 2), Ay - 44 * L.sin((g1 + g2) / 2) + 6, A + '°', 15, 'font-style="normal"') +
        L.cham(Ax, Ay) + L.cham(Bx, By) + L.cham(Cx, Cy) +
        L.chu(Ax, Ay + 26, 'A') + L.chu(Bx - 14, By - 10, 'B') + L.chu(Cx + 14, Cy - 10, 'C') + '</svg>';
      return { loai: 'tl', de: 'Từ ngã ba $A$, hai con đường thẳng $AB$ và $AC$ hợp với nhau một góc $' + A + '^\\circ$. ' + dd[0] + ' ở vị trí $B$ cách $A$ là $' + b + '$ km, ' + dd[1] + ' ở vị trí $C$ cách $A$ là $' + c + '$ km. Hỏi khoảng cách giữa ' + dd[0].toLowerCase() + ' và ' + dd[1] + ' (theo đường chim bay) bằng bao nhiêu km?',
        hinh: s, da: a, hienDa: String(a),
        giai: '$BC^2=AB^2+AC^2-2\\cdot AB\\cdot AC\\cdot\\cos A=' + b + '^2+' + c + '^2-2\\cdot ' + b + '\\cdot ' + c + '\\cdot\\cos' + A + '^\\circ=' + (a * a) + '$ $\\Rightarrow BC=' + a + '$ (km).' };
    } });

  cau.push({ phan: 3, chuDe: 'Đo khoảng cách hai điểm không đến được (định lí sin, côsin)',
    kienThuc: '<ul><li>Biết một cạnh và hai góc kề: tính góc còn lại ($180^\\circ$ trừ tổng hai góc), rồi dùng định lí sin $\\dfrac{a}{\\sin A}=\\dfrac{b}{\\sin B}$ để tính cạnh.</li><li>Biết hai cạnh và góc xen giữa: dùng định lí côsin để tính cạnh thứ ba.</li><li>Giữ nhiều chữ số thập phân ở bước trung gian (dùng bộ nhớ máy tính), chỉ làm tròn ở kết quả cuối.</li></ul>',
    tao: function (r) {
      var AB = r.chon([300, 400, 500, 600]), a1 = r.chon([60, 65, 70, 75, 80]), b1 = r.chon([40, 45, 50, 55]), a2 = r.chon([30, 35, 40, 45]), b2 = r.chon([90, 95, 100, 105, 110]);
      if (a1 - a2 < 20 || a1 + b1 > 130 || a2 + b2 > 150) throw new Error('lai');
      var C1 = 180 - a1 - b1, D1 = 180 - a2 - b2, AC = AB * L.sin(b1) / L.sin(C1), AD = AB * L.sin(b2) / L.sin(D1), g = a1 - a2;
      var CD = Math.sqrt(AC * AC + AD * AD - 2 * AC * AD * L.cos(g));
      if (L.ganNuaDV(CD, 1)) throw new Error('lai');
      // hình theo đúng số liệu
      var k = 300 / Math.max(AB, AD * L.cos(a2), AC * L.cos(a1)), H = 0;
      var P = { A: [0, 0], B: [AB * k, 0], C: [AC * k * L.cos(a1), AC * k * L.sin(a1)], D: [AD * k * L.cos(a2), AD * k * L.sin(a2)] };
      H = Math.max(P.C[1], P.D[1]);
      var xmin = Math.min(0, P.C[0], P.D[0]) - 40, xmax = Math.max(P.B[0], P.C[0], P.D[0]) + 40, Y = function (y) { return H + 40 - y; };
      var s = '<svg viewBox="' + xmin.toFixed(0) + ' 0 ' + (xmax - xmin).toFixed(0) + ' ' + (H + 100).toFixed(0) + '" class="hinh" style="max-width:380px" role="img" aria-label="Hai hòn đảo C, D và hai vị trí A, B trên bờ">' +
        '<rect x="' + xmin.toFixed(0) + '" y="0" width="' + (xmax - xmin).toFixed(0) + '" height="' + (H + 50).toFixed(0) + '" fill="#d4ecf7"/><rect x="' + xmin.toFixed(0) + '" y="' + (H + 50).toFixed(0) + '" width="' + (xmax - xmin).toFixed(0) + '" height="50" fill="#f5e0b7"/>';
      [['A', 'C'], ['B', 'C'], ['A', 'D'], ['B', 'D'], ['A', 'B']].forEach(function (e) { s += '<line x1="' + P[e[0]][0].toFixed(1) + '" y1="' + Y(P[e[0]][1]).toFixed(1) + '" x2="' + P[e[1]][0].toFixed(1) + '" y2="' + Y(P[e[1]][1]).toFixed(1) + '" ' + L.NET + '/>'; });
      ['C', 'D'].forEach(function (t) { s += '<ellipse cx="' + P[t][0].toFixed(1) + '" cy="' + Y(P[t][1]).toFixed(1) + '" rx="22" ry="8" fill="#e8d39e" stroke="#b49a5c"/><ellipse cx="' + P[t][0].toFixed(1) + '" cy="' + (Y(P[t][1]) - 2).toFixed(1) + '" rx="12" ry="5" fill="#7cc36b"/>'; });
      ['A', 'B', 'C', 'D'].forEach(function (t) { s += L.cham(P[t][0], Y(P[t][1])); });
      s += L.chu(P.A[0] - 16, Y(0) + 6, 'A') + L.chu(P.B[0] + 16, Y(0) + 6, 'B') + L.chu(P.C[0] - 4, Y(P.C[1]) - 16, 'C') + L.chu(P.D[0] + 4, Y(P.D[1]) - 16, 'D') +
        L.chu(P.B[0] / 2, Y(0) + 30, AB + ' m', 18, 'font-style="normal" font-weight="bold" fill="#1f6fd1"') + '</svg>';
      return { loai: 'tl', de: 'Hai hòn đảo nhỏ $C$ và $D$ nằm ngoài khơi. Để tính khoảng cách giữa hai hòn đảo, từ hai vị trí $A$ và $B$ trên bờ biển cách nhau $' + AB + '$ m, người ta đo được $\\widehat{CAB}=' + a1 + '^\\circ$, $\\widehat{CBA}=' + b1 + '^\\circ$, $\\widehat{DAB}=' + a2 + '^\\circ$ và $\\widehat{DBA}=' + b2 + '^\\circ$ (như hình vẽ). Tính khoảng cách giữa hai hòn đảo $C$ và $D$ (đơn vị: m). <b>(Kết quả làm tròn đến hàng đơn vị).</b>',
        hinh: s, da: Math.round(CD), hienDa: String(Math.round(CD)),
        giai: 'Tam giác $ABC$: $\\widehat{ACB}=180^\\circ-' + a1 + '^\\circ-' + b1 + '^\\circ=' + C1 + '^\\circ$, $AC=\\dfrac{AB\\cdot\\sin' + b1 + '^\\circ}{\\sin' + C1 + '^\\circ}\\approx' + L.soVN(AC, 2) + '$ (m).<br>' +
          'Tam giác $ABD$: $\\widehat{ADB}=180^\\circ-' + a2 + '^\\circ-' + b2 + '^\\circ=' + D1 + '^\\circ$, $AD=\\dfrac{AB\\cdot\\sin' + b2 + '^\\circ}{\\sin' + D1 + '^\\circ}\\approx' + L.soVN(AD, 2) + '$ (m).<br>' +
          '$\\widehat{CAD}=' + a1 + '^\\circ-' + a2 + '^\\circ=' + g + '^\\circ$. Tam giác $ACD$: $CD^2=AC^2+AD^2-2\\cdot AC\\cdot AD\\cdot\\cos' + g + '^\\circ\\approx' + L.soVN(CD * CD, 1) + '$ $\\Rightarrow CD\\approx' + Math.round(CD) + '$ (m).' };
    } });

  cau.push({ phan: 3, chuDe: 'Bài toán tối ưu (hệ bất phương trình bậc nhất hai ẩn)', nangCao: true,
    kienThuc: '<ul><li>Gọi ẩn $x,y$ (có điều kiện $x\\ge0$, $y\\ge0$), lập hệ bất phương trình từ các giới hạn (thời gian, nguyên liệu...).</li><li>Biểu diễn miền nghiệm: miền đa giác. Giá trị lớn nhất (nhỏ nhất) của $F=ax+by$ đạt tại <b>một đỉnh</b> của miền đa giác.</li><li>Tìm toạ độ các đỉnh (giao điểm của các đường thẳng biên), tính $F$ tại từng đỉnh rồi so sánh.</li></ul>',
    tao: function (r) {
      var x0 = r.so(2, 8), y0 = r.so(2, 8), a1 = r.so(1, 4), b1 = r.so(1, 4), a2 = r.so(1, 4), b2 = r.so(1, 4), p = r.so(2, 9), q = r.so(2, 9);
      var c1 = a1 * x0 + b1 * y0, c2 = a2 * x0 + b2 * y0;
      // hai đường thẳng cắt nhau trong góc phần tư thứ nhất tạo miền tứ giác
      if (!(c1 / a1 > c2 / a2 && c1 / b1 < c2 / b2) || a1 * b2 === a2 * b1) throw new Error('lai');
      var X = c2 / a2, Yy = c1 / b1, F0 = p * x0 + q * y0, FX = p * X, FY = q * Yy;
      if (F0 - Math.max(FX, FY) < 1) throw new Error('lai');
      var sp = r.chon([['sản phẩm I', 'sản phẩm II', 'tấn', 'máy cắt', 'máy đóng gói', 'Sản phẩm I', 'Sản phẩm II'], ['bánh dẻo', 'bánh nướng', 'tạ', 'lò trộn', 'lò nướng', 'Bánh dẻo', 'Bánh nướng'], ['phân bón loại A', 'phân bón loại B', 'tấn', 'dây chuyền nghiền', 'dây chuyền trộn', 'Phân loại A', 'Phân loại B']]);
      var gio = function (n) { return n + ' giờ'; };
      // hình minh hoạ: bảng số liệu của xưởng
      var cot = [0, 180, 300, 420, 540], hang = [0, 56, 102, 148, 194], nen = ['#eef0ff', '#fff', '#f7f8fc', '#fff4de'];
      var o = function (c, h, t, dam) { return '<text x="' + ((cot[c] + cot[c + 1]) / 2) + '" y="' + (hang[h] + (h ? 29 : 24)) + '" font-size="16" text-anchor="middle" font-family="system-ui,sans-serif" fill="#1f2a5a"' + (dam ? ' font-weight="700"' : '') + '>' + t + '</text>'; };
      var hinh = '<svg viewBox="-2 -2 544 200" class="hinh" style="max-width:460px" role="img" aria-label="Bảng thời gian dùng máy và tiền lãi">';
      for (var hh = 0; hh < 4; hh++) hinh += '<rect x="0" y="' + hang[hh] + '" width="540" height="' + (hang[hh + 1] - hang[hh]) + '" fill="' + nen[hh] + '"/>';
      hinh += '<rect x="0" y="0" width="540" height="194" fill="none" stroke="#5b6b84" stroke-width="1.5" rx="6"/>';
      [1, 2, 3].forEach(function (c) { hinh += '<line x1="' + cot[c] + '" y1="0" x2="' + cot[c] + '" y2="194" stroke="#c3c9d8"/>'; });
      [1, 2, 3].forEach(function (h) { hinh += '<line x1="0" y1="' + hang[h] + '" x2="540" y2="' + hang[h] + '" stroke="#c3c9d8"/>'; });
      var hoa = function (t) { return t.charAt(0).toUpperCase() + t.slice(1); };
      var dau2 = function (c, t, t2) { return '<text x="' + ((cot[c] + cot[c + 1]) / 2) + '" y="23" font-size="16" font-weight="700" text-anchor="middle" font-family="system-ui,sans-serif" fill="#1f2a5a">' + t + '</text><text x="' + ((cot[c] + cot[c + 1]) / 2) + '" y="44" font-size="13" text-anchor="middle" font-family="system-ui,sans-serif" fill="#5f6b85">' + t2 + '</text>'; };
      hinh += dau2(1, sp[5], '(mỗi ' + sp[2] + ')') + dau2(2, sp[6], '(mỗi ' + sp[2] + ')') + dau2(3, 'Tối đa', '(mỗi ngày)') +
        o(0, 1, hoa(sp[3]), true) + o(1, 1, gio(a1)) + o(2, 1, gio(b1)) + o(3, 1, gio(c1)) +

  cau.push({ phan: 3, chuDe: 'Toạ độ: điểm làm tổng khoảng cách nhỏ nhất', nangCao: true,
    kienThuc: '<ul><li>Bài toán "$M$ thuộc đường thẳng $d$, tìm $M$ để $MA+MB$ nhỏ nhất": nếu $A$, $B$ <b>cùng phía</b> với $d$ thì lấy $A\'$ đối xứng với $A$ qua $d$; khi đó $MA+MB=MA\'+MB\\ge A\'B$, dấu bằng khi $M$ là giao điểm của $A\'B$ với $d$.</li><li>Điểm đối xứng của $A(x;y)$ qua trục $Ox$ là $A\'(x;-y)$.</li><li>Ba điểm $A\'$, $M$, $B$ thẳng hàng $\\Leftrightarrow$ $' + vt("A'M") + '$ và $' + vt("A'B") + '$ cùng phương.</li></ul>',

  /* ======================= PHẦN I ======================= */
  cau.push({ phan: 1, muc: 'Biết', chuDe: 'Mệnh đề chứa biến, phủ định mệnh đề có lượng từ',
    kienThuc: '<ul><li>Phủ định của "$\\forall x\\in X,\\ P(x)$" là "$\\exists x\\in X,\\ \\overline{P(x)}$"; phủ định của "$\\exists x\\in X,\\ P(x)$" là "$\\forall x\\in X,\\ \\overline{P(x)}$".</li><li>Phủ định của $>$ là $\\le$; của $<$ là $\\ge$; của $=$ là $\\ne$.</li></ul>',
    tao: function (r) {
      var b = r.soKhac0(-6, 6), c = r.so(-5, 9), tap = r.chon(['\\mathbb R', '\\mathbb Z', '\\mathbb N']), moi = r.tung();
      var dau = r.chon(['>', '<', '\\ge', '\\le', '=']), phu = { '>': '\\le', '<': '\\ge', '\\ge': '<', '\\le': '>', '=': '\\ne' }[dau], sai1 = { '>': '<', '<': '>', '\\ge': '\\le', '\\le': '\\ge', '=': '<' }[dau];

      var M = function (q, d) { return '$' + q + ' x\\in ' + tap + ',\\ ' + f + d + ' 0$'; };

      var ds = [];

  cau.push({ phan: 1, muc: 'Hiểu', chuDe: 'Tập con',

    tao: function (r) {

    } });

  cau.push({ phan: 1, muc: 'Biết', chuDe: 'Hệ bất phương trình bậc nhất hai ẩn',
    kienThuc: '<ul><li>Điểm $(x_0;y_0)$ thuộc miền nghiệm của hệ khi toạ độ của nó thoả mãn <b>tất cả</b> các bất phương trình của hệ.</li><li>Chỉ cần một bất phương trình không thoả mãn là điểm đó không thuộc miền nghiệm.</li></ul>',
    tao: function (r) {
      var a1 = r.soKhac0(-3, 3), b1 = r.soKhac0(-3, 3), c1 = r.so(-6, 6), a2 = r.soKhac0(-3, 3), b2 = r.soKhac0(-3, 3), c2 = r.so(-6, 6);
      var d1 = r.chon(['\\le', '>']), d2 = r.chon(['\\ge', '<']);
      var ok = function (v, d) { return d === '\\le' ? v <= 0 : d === '>' ? v > 0 : d === '\\ge' ? v >= 0 : v < 0; };
      var dung = null, sai = [];
      for (var t = 0; t < 400 && (!dung || sai.length < 3); t++) {
        var x = r.so(-4, 4), y = r.so(-4, 4), v1 = a1 * x + b1 * y + c1, v2 = a2 * x + b2 * y + c2, k = x + ';' + y;
        if (v1 === 0 || v2 === 0 || (dung && dung.k === k) || sai.some(function (s) { return s.k === k; })) continue;

        else if (sai.length < 3 && (o1 || o2 || sai.length === 2)) sai.push({ x: x, y: y, v1: v1, v2: v2, k: k, o1: o1 });
      }

      var ds = r.tron([dung].concat(sai)), tenD = ['M', 'N', 'P', 'Q'], j = ds.indexOf(dung);
      var e1 = L.bieuThuc([[a1, 'x'], [b1, 'y'], [c1, '']]), e2 = L.bieuThuc([[a2, 'x'], [b2, 'y'], [c2, '']]);
      return { loai: 'tn', de: 'Điểm nào sau đây thuộc miền nghiệm của hệ bất phương trình $\\begin{cases}' + e1 + d1 + ' 0\\\\' + e2 + d2 + ' 0\\end{cases}$?',
        pa: ds.map(function (d, i) { return '$' + tenD[i] + td(d.x, d.y) + '$'; }), dung: j,

    } });

  cau.push({ phan: 1, muc: 'Hiểu', chuDe: 'Biểu diễn miền nghiệm của bất phương trình bậc nhất hai ẩn',
    kienThuc: '<ul><li>Đường thẳng đi qua $(p;0)$ và $(0;q)$ có phương trình $\\dfrac xp+\\dfrac yq=1$.</li><li>Để biết nửa mặt phẳng nào là miền nghiệm: thay toạ độ một điểm không nằm trên bờ (thường là $O(0;0)$) vào bất phương trình.</li><li>Bờ là đường liền: có dấu $\\le,\\ge$; bờ là đường nét đứt: dấu $<,>$.</li></ul>',
    tao: function (r) {
      var p = r.soKhac0(-4, 4), q = r.soKhac0(-4, 4); if (Math.abs(p) < 2 && Math.abs(q) < 2) lai();
      // đường thẳng qx + py = pq
      var g = L.ucln(L.ucln(q, p), p * q), A = q / g, B = p / g, C = p * q / g; if (A < 0) { A = -A; B = -B; C = -C; }
      var chuaO = r.tung(), net = r.tung(); // miền nghiệm chứa O hay không; bờ liền hay đứt
      var dauO = 0 < C ? (net ? '\\le' : '<') : (net ? '\\ge' : '>'); // dấu để O thoả: A*0+B*0 = 0 so với C
      var dau = chuaO ? dauO : { '\\le': '\\ge', '<': '>', '\\ge': '\\le', '>': '<' }[dauO];
      var nguoc = { '\\le': '\\ge', '<': '>', '\\ge': '\\le', '>': '<' }[dau], doiNet = { '\\le': '<', '<': '\\le', '\\ge': '>', '>': '\\ge' }[dau];
      var e = L.bieuThuc([[A, 'x'], [B, 'y']]), e2 = L.bieuThuc([[B, 'x'], [A, 'y']]);
      if (e === e2) lai();
      var pa = L.tronPA(r, '$' + e + dau + ' ' + C + '$', ['$' + e + nguoc + ' ' + C + '$', '$' + e + doiNet + ' ' + C + '$', '$' + e2 + dau + ' ' + C + '$']);
      // hình
      var o = 26, W = 12 * o, X = function (x) { return (x + 6) * o; }, Y = function (y) { return (6 - y) * o; };
      var s = '<svg viewBox="0 0 ' + W + ' ' + W + '" class="hinh hinh-nho" style="max-width:300px" role="img" aria-label="Miền nghiệm của một bất phương trình">';
      for (var i = 0; i <= 12; i++) s += '<line x1="' + i * o + '" y1="0" x2="' + i * o + '" y2="' + W + '" stroke="#eceff5"/><line x1="0" y1="' + i * o + '" x2="' + W + '" y2="' + i * o + '" stroke="#eceff5"/>';
      // tô phần KHÔNG là miền nghiệm (bị gạch bỏ)
      var pts = [[-6, -6], [6, -6], [6, 6], [-6, 6]], bo = [];
      var ngoai = function (x, y) { var v = A * x + B * y - C; var thoa = dau === '\\le' ? v <= 0 : dau === '<' ? v < 0 : dau === '\\ge' ? v >= 0 : v > 0; return !thoa; };
      for (var k2 = 0; k2 < 4; k2++) {
        var P1 = pts[k2], P2 = pts[(k2 + 1) % 4], f1 = A * P1[0] + B * P1[1] - C, f2 = A * P2[0] + B * P2[1] - C;
        if (ngoai(P1[0], P1[1])) bo.push(P1);
        if (f1 * f2 < 0) { var t = f1 / (f1 - f2); bo.push([P1[0] + t * (P2[0] - P1[0]), P1[1] + t * (P2[1] - P1[1])]); }
      }
      s += '<defs><pattern id="gach5" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#e6e9f2"/><line x1="0" y1="0" x2="0" y2="8" stroke="#9aa3b8" stroke-width="2.5"/></pattern></defs>';
      s += '<polygon points="' + bo.map(function (p2) { return X(p2[0]).toFixed(1) + ',' + Y(p2[1]).toFixed(1); }).join(' ') + '" fill="url(#gach5)" opacity=".9"/>';
      s += '<line x1="0" y1="' + Y(0) + '" x2="' + W + '" y2="' + Y(0) + '" stroke="#333" stroke-width="1.4"/><line x1="' + X(0) + '" y1="0" x2="' + X(0) + '" y2="' + W + '" stroke="#333" stroke-width="1.4"/>' +
        '<text x="' + (W - 10) + '" y="' + (Y(0) - 6) + '" font-size="15" ' + L.CHU + '>x</text><text x="' + (X(0) + 6) + '" y="14" font-size="15" ' + L.CHU + '>y</text>' + L.chu(X(0) - 9, Y(0) + 16, 'O', 14);
      var l1 = [-6, (C - A * -6) / B], l2 = [6, (C - A * 6) / B];
      s += '<line x1="' + X(l1[0]).toFixed(1) + '" y1="' + Y(l1[1]).toFixed(1) + '" x2="' + X(l2[0]).toFixed(1) + '" y2="' + Y(l2[1]).toFixed(1) + '" stroke="#1f2a5a" stroke-width="2.6"' + (net ? '' : ' stroke-dasharray="7 5"') + '/>';
      s += L.chu(X(p) + (p > 0 ? 8 : -8), Y(0) + 17, String(p), 14, 'font-style="normal"') + L.chu(X(0) + (q > 0 ? -12 : -12), Y(q) + 5, String(q), 14, 'font-style="normal"') + '</svg>';
      return { loai: 'tn', de: 'Phần không bị gạch (' + (net ? 'kể cả bờ là đường liền' : 'không kể bờ là đường nét đứt') + ') trong hình sau là miền nghiệm của bất phương trình nào?', hinh: s, pa: pa.pa, dung: pa.dung,
        giai: 'Bờ đi qua $(' + p + ';0)$ và $(0;' + q + ')$: $\\dfrac x{' + p + '}+\\dfrac y{' + q + '}=1\\Leftrightarrow ' + e + '=' + C + '$. Bờ ' + (net ? 'liền nên có dấu bằng' : 'nét đứt nên không có dấu bằng') + '. Điểm $O(0;0)$ ' + (chuaO ? '' : 'không ') + 'thuộc miền nghiệm (thay $x=0,\\ y=0$ vào vế trái được $0$, so với $' + C + '$) nên chọn $' + e + dau + ' ' + C + '$.' };
    } });

  cau.push({ phan: 1, muc: 'Hiểu', chuDe: 'Giá trị lượng giác của góc từ $0^\\circ$ đến $180^\\circ$',
    kienThuc: '<ul><li>$\\sin^2\\alpha+\\cos^2\\alpha=1$, $\\tan\\alpha=\\dfrac{\\sin\\alpha}{\\cos\\alpha}$.</li><li>Với $0^\\circ\\le\\alpha\\le180^\\circ$: $\\sin\\alpha\\ge0$. Góc tù ($90^\\circ<\\alpha<180^\\circ$) thì $\\cos\\alpha<0$, $\\tan\\alpha<0$.</li></ul>',
    tao: function (r) {
      var t = r.chon([[3, 4, 5], [5, 12, 13], [8, 15, 17], [7, 24, 25], [20, 21, 29]]), sw = r.tung(), a = sw ? t[1] : t[0], b = sw ? t[0] : t[1], c = t[2], loai = r.so(0, 2);
      var de, dung, sai, giai;
      if (loai === 0) { de = '$\\sin\\alpha=' + ps(a, c) + '$. Giá trị của $\\cos\\alpha$ bằng'; dung = ps(-b, c); sai = [ps(b, c), ps(-a, c), ps(-b, a)]; giai = '$\\cos^2\\alpha=1-\\sin^2\\alpha=1-' + ps(a * a, c * c) + '=' + ps(b * b, c * c) + '$. Vì $\\alpha$ tù nên $\\cos\\alpha<0$: $\\cos\\alpha=' + dung + '$.'; }
      else if (loai === 1) { de = '$\\cos\\alpha=' + ps(-b, c) + '$. Giá trị của $\\sin\\alpha$ bằng'; dung = ps(a, c); sai = [ps(-a, c), ps(b, c), ps(a, b)]; giai = '$\\sin^2\\alpha=1-\\cos^2\\alpha=' + ps(a * a, c * c) + '$. Vì $\\sin\\alpha>0$ nên $\\sin\\alpha=' + dung + '$.'; }
      else { de = '$\\sin\\alpha=' + ps(a, c) + '$. Giá trị của $\\tan\\alpha$ bằng'; dung = ps(-a, b); sai = [ps(a, b), ps(-b, a), ps(-a, c)]; giai = '$\\cos\\alpha=-\\sqrt{1-' + ps(a * a, c * c) + '}=' + ps(-b, c) + '$ (góc tù), $\\tan\\alpha=\\dfrac{\\sin\\alpha}{\\cos\\alpha}=' + dung + '$.'; }
      var p = L.tronPA(r, '$' + dung + '$', sai.map(function (x) { return '$' + x + '$'; }));
      return { loai: 'tn', de: 'Cho góc $\\alpha$ thoả mãn $90^\\circ<\\alpha<180^\\circ$ và ' + de, pa: p.pa, dung: p.dung, giai: giai };
    } });

  cau.push({ phan: 1, muc: 'Biết', chuDe: 'Giá trị lượng giác của các góc đặc biệt',
    kienThuc: '<ul><li>Bảng: $\\sin30^\\circ=\\cos60^\\circ=\\dfrac12$; $\\sin45^\\circ=\\cos45^\\circ=\\dfrac{\\sqrt2}2$; $\\sin60^\\circ=\\cos30^\\circ=\\dfrac{\\sqrt3}2$; $\\tan45^\\circ=1$.</li><li>Góc bù nhau: $\\sin(180^\\circ-\\alpha)=\\sin\\alpha$, $\\cos(180^\\circ-\\alpha)=-\\cos\\alpha$, $\\tan(180^\\circ-\\alpha)=-\\tan\\alpha$.</li></ul>',
    tao: function (r) {
      var KHO = [['\\cos60^\\circ', 1, 2, 1, 2], ['\\sin30^\\circ', 1, 2, 1, 2], ['\\sin^2 45^\\circ', 1, 2, 1, 2], ['\\cos^2 30^\\circ', 3, 4, 3, 4], ['\\sin^2 60^\\circ', 3, 4, 3, 4], ['\\tan45^\\circ', 1, 1, 1, 1],
        ['\\tan135^\\circ', -1, 1, 1, 1], ['\\cos120^\\circ', -1, 2, 1, 2], ['\\sin150^\\circ', 1, 2, 1, 2], ['\\cos180^\\circ', -1, 1, 1, 1], ['\\sin90^\\circ', 1, 1, 1, 1], ['\\cos^2 135^\\circ', 1, 2, 1, 2], ['\\cos150^\\circ\\cdot\\cos30^\\circ', -3, 4, 3, 4]];
      var ch = r.tron(KHO).slice(0, 3), he = [r.so(1, 3), r.so(1, 3), r.so(1, 2)], tu = 0, tuSai = 0, mau = 4;
      ch.forEach(function (x, i) { tu += he[i] * x[1] * mau / x[2]; tuSai += he[i] * x[3] * mau / x[4]; });
      var dung = ps(tu, mau), sai = L.khacNhau([ps(tuSai, mau), ps(tu + 2, mau), ps(tu - 2, mau), ps(-tu, mau), ps(tu + 4, mau)].filter(function (x) { return x !== dung; }), 3);
      var bt = ch.map(function (x, i) { return (he[i] > 1 ? he[i] : '') + x[0]; }).join('+');
      var p = L.tronPA(r, '$' + dung + '$', sai.map(function (x) { return '$' + x + '$'; }));
      return { loai: 'tn', de: 'Giá trị của biểu thức $P=' + bt + '$ bằng', pa: p.pa, dung: p.dung,
        giai: '$P=' + ch.map(function (x, i) { return (he[i] > 1 ? he[i] + '\\cdot ' : '') + '\\left(' + ps(x[1], x[2]) + '\\right)'; }).join('+') + '=' + dung + '$.' };
    } });

  cau.push({ phan: 1, muc: 'Hiểu', chuDe: 'Diện tích tam giác, bán kính đường tròn nội tiếp, ngoại tiếp',
    kienThuc: '<ul><li>Công thức Heron: $S=\\sqrt{p(p-a)(p-b)(p-c)}$ với $p=\\dfrac{a+b+c}{2}$ (nửa chu vi).</li><li>$S=pr$ $\\Rightarrow r=\\dfrac Sp$; $S=\\dfrac{abc}{4R}$ $\\Rightarrow R=\\dfrac{abc}{4S}$.</li></ul>',
    tao: function (r) {
      var t = r.chon(HERON), k = r.chon([1, 1, 2]), a = t[0] * k, b = t[1] * k, c = t[2] * k, S = t[3] * k * k, p2 = a + b + c, hoi = r.so(0, 2);
      if (p2 % 2) lai();
      var p = p2 / 2, de, dung, sai, giai = '$p=\\dfrac{' + a + '+' + b + '+' + c + '}{2}=' + p + '$, $S=\\sqrt{' + p + '\\cdot ' + (p - a) + '\\cdot ' + (p - b) + '\\cdot ' + (p - c) + '}=' + S + '$';
      if (hoi === 0) { de = 'Diện tích tam giác $ABC$ bằng'; dung = String(S); sai = [String(2 * S), ps(S, 2), String(p * 2)]; giai += '.'; }
      else if (hoi === 1) { de = 'Bán kính đường tròn nội tiếp tam giác $ABC$ bằng'; dung = ps(S, p); sai = [ps(2 * S, p), ps(S, 2 * p), ps(a * b * c, 4 * S)]; giai += '; $r=\\dfrac Sp=\\dfrac{' + S + '}{' + p + '}=' + dung + '$.'; }
      else { de = 'Bán kính đường tròn ngoại tiếp tam giác $ABC$ bằng'; dung = ps(a * b * c, 4 * S); sai = [ps(a * b * c, 2 * S), ps(S, p), ps(a * b * c, S)]; giai += '; $R=\\dfrac{abc}{4S}=\\dfrac{' + a + '\\cdot ' + b + '\\cdot ' + c + '}{4\\cdot ' + S + '}=' + dung + '$.'; }
      var pa = L.tronPA(r, '$' + dung + '$', L.khacNhau(sai.filter(function (x) { return x !== dung; }).concat([ps(S, 3), String(S + p)]), 3).map(function (x) { return '$' + x + '$'; }));
      return { loai: 'tn', de: 'Cho tam giác $ABC$ có $BC=' + a + '$, $CA=' + b + '$, $AB=' + c + '$. ' + de, pa: pa.pa, dung: pa.dung, giai: giai };
    } });

  cau.push({ phan: 1, muc: 'Biết', chuDe: 'Hai vectơ bằng nhau',
    kienThuc: '<ul><li>Hai vectơ bằng nhau khi chúng <b>cùng hướng</b> và <b>cùng độ dài</b>.</li><li>Lục giác đều $ABCDEF$ tâm $O$ được chia thành 6 tam giác đều bằng nhau; các tứ giác như $OABC$, $OCDE$ là hình thoi.</li></ul>',
    tao: function (r) {
      var ten = ['A', 'B', 'C', 'D', 'E', 'F', 'O'], P = {};
      for (var i = 0; i < 6; i++) P[ten[i]] = [Math.cos(i * Math.PI / 3), Math.sin(i * Math.PI / 3)]; P.O = [0, 0];
      var muc = r.tung() ? ['O', ten[r.so(0, 5)]] : (function () { var j = r.so(0, 5); return [ten[j], ten[(j + 1) % 6]]; })();
      if (r.tung()) muc = [muc[1], muc[0]];
      var d = [P[muc[1]][0] - P[muc[0]][0], P[muc[1]][1] - P[muc[0]][1]], bang = [];
      ten.forEach(function (u) { ten.forEach(function (v) { if (u === v || (u === muc[0] && v === muc[1])) return; if (Math.abs(P[v][0] - P[u][0] - d[0]) < 1e-9 && Math.abs(P[v][1] - P[u][1] - d[1]) < 1e-9) bang.push(u + v); }); });
      var n = bang.length, pa = L.tronPA(r, '$' + n + '$', ['$' + (n - 1) + '$', '$' + (n + 1) + '$', '$' + (2 * n) + '$']);
      var s = '<svg viewBox="-130 -118 260 236" class="hinh hinh-nho" style="max-width:240px" role="img" aria-label="Lục giác đều ABCDEF tâm O">', R2 = 95;
      var Q = function (t) { return [P[t][0] * R2, -P[t][1] * R2]; };
      s += '<polygon points="' + ten.slice(0, 6).map(function (t) { return Q(t).map(function (x) { return x.toFixed(1); }).join(','); }).join(' ') + '" ' + L.NET + '/>';
      ['A', 'B', 'C'].forEach(function (t, i) { var a = Q(t), b = Q(ten[i + 3]); s += '<line x1="' + a[0].toFixed(1) + '" y1="' + a[1].toFixed(1) + '" x2="' + b[0].toFixed(1) + '" y2="' + b[1].toFixed(1) + '" stroke="#8a93ad" stroke-width="1.4"/>'; });
      ten.forEach(function (t) { var a = Q(t), l = t === 'O' ? [12, -8] : [a[0] * 0.2, a[1] * 0.2 + 6]; s += L.cham(a[0], a[1]) + L.chu(a[0] + l[0], a[1] + l[1], t, 18); });
      s += '</svg>';
      return { loai: 'tn', de: 'Cho lục giác đều $ABCDEF$ tâm $O$. Số vectơ khác $\\vec 0$, bằng vectơ $' + vt(muc.join('')) + '$ (không kể chính nó), có điểm đầu và điểm cuối là các điểm trong 7 điểm $A,B,C,D,E,F,O$ là', hinh: s, pa: pa.pa, dung: pa.dung,
        giai: 'Các vectơ cùng hướng và cùng độ dài với $' + vt(muc.join('')) + '$: ' + bang.map(function (x) { return '$' + vt(x) + '$'; }).join(', ') + '. Có $' + n + '$ vectơ.' };
    } });

  cau.push({ phan: 1, muc: 'Hiểu', chuDe: 'Góc giữa hai vectơ (toạ độ)',
    kienThuc: '<ul><li>$\\cos(\\vec a,\\vec b)=\\dfrac{\\vec a\\cdot\\vec b}{|\\vec a|\\cdot|\\vec b|}=\\dfrac{x_1x_2+y_1y_2}{\\sqrt{x_1^2+y_1^2}\\cdot\\sqrt{x_2^2+y_2^2}}$.</li><li>Góc giữa hai vectơ nằm trong $[0^\\circ;180^\\circ]$; $\\cos<0$ thì góc tù.</li></ul>',
    tao: function (r) {
      var G = [[30, Math.sqrt(3) / 2], [45, Math.SQRT1_2], [60, 0.5], [90, 0], [120, -0.5], [135, -Math.SQRT1_2], [150, -Math.sqrt(3) / 2]], x1, y1, x2, y2, g = null;
      for (var t = 0; t < 2000 && !g; t++) {
        x1 = r.soKhac0(-5, 5); y1 = r.so(-5, 5); x2 = r.so(-5, 5); y2 = r.soKhac0(-5, 5);
        var c = (x1 * x2 + y1 * y2) / Math.sqrt((x1 * x1 + y1 * y1) * (x2 * x2 + y2 * y2));
        G.forEach(function (q) { if (Math.abs(c - q[1]) < 1e-9 && q[0] !== 90) g = q[0]; });
        if (g && x1 * y2 - x2 * y1 === 0) g = null;
      }
      if (!g) lai();
      var d = x1 * x2 + y1 * y2, n1 = x1 * x1 + y1 * y1, n2 = x2 * x2 + y2 * y2;
      var sai = L.khacNhau([180 - g, g === 45 || g === 135 ? 90 : g < 90 ? g + 15 : g - 15, g < 90 ? 90 - g : g - 90 === g ? 30 : g - 90, 60, 120].filter(function (x) { return x !== g && x > 0 && x < 180; }).map(String), 3);
      var p = L.tronPA(r, '$' + g + '^\\circ$', sai.map(function (x) { return '$' + x + '^\\circ$'; }));

  cau.push({ phan: 1, muc: 'Hiểu', chuDe: 'Tích vô hướng trong tam giác đều (góc giữa hai vectơ)',

  cau.push({ phan: 1, muc: 'Vận dụng', chuDe: 'Điều kiện hai vectơ vuông góc, cùng phương',

  cau.push({ phan: 2, muc: 'Biết → Vận dụng', chuDe: 'Tập hợp: giao, hiệu, phần bù, đếm phần tử nguyên',

  cau.push({ phan: 2, muc: 'Biết → Vận dụng', chuDe: 'Hệ bất phương trình bậc nhất hai ẩn trong thực tế',
    kienThuc: '<ul><li>Gọi ẩn, đặt điều kiện $x\\ge0$, $y\\ge0$; mỗi giới hạn (diện tích, tiền vốn, thời gian...) cho một bất phương trình.</li><li>Miền nghiệm là đa giác; giá trị lớn nhất của $F=ax+by$ đạt tại một đỉnh: tính $F$ tại các đỉnh rồi so sánh.</li></ul>',
    tao: function (r) {

      var N = x0 + y0, M = c1 * x0 + c2 * y0, p = r.so(3, 9), q = r.so(3, 9);

      var X = Math.min(N, M / c1), Yy = Math.min(N, M / c2), dinh = [[0, 0], [X, 0], [x0, y0], [0, Yy]], F = dinh.map(function (d) { return p * d[0] + q * d[1]; });

      var tx = r.so(0, N), ty = r.so(0, N), thoa = tx + ty <= N && c1 * tx + c2 * ty <= M;
      var vSai = [y0, x0], dinhDung = '(' + x0 + ';' + y0 + ')', dinhSai = '(' + vSai[0] + ';' + vSai[1] + ')'; if (x0 === y0) dinhSai = '(' + (x0 + 1) + ';' + (y0 - 1) + ')';
      var y = chonDS(r, [
        ['Cặp số $' + td(tx, ty) + '$ ' + (thoa ? '' : 'không ') + 'thoả mãn các điều kiện của bài toán.', 'Cặp số $' + td(tx, ty) + '$ ' + (thoa ? 'không ' : '') + 'thoả mãn các điều kiện của bài toán.', 'Kiểm tra: $' + tx + '+' + ty + '=' + (tx + ty) + (tx + ty <= N ? '\\le' : '>') + N + '$; $' + c1 + '\\cdot ' + tx + '+' + c2 + '\\cdot ' + ty + '=' + (c1 * tx + c2 * ty) + (c1 * tx + c2 * ty <= M ? '\\le' : '>') + M + '$ nên cặp số ' + (thoa ? '' : 'không ') + 'thoả mãn.'],
        ['Các điều kiện là $x+y\\le ' + N + '$, $' + c1 + 'x+' + c2 + 'y\\le ' + M + '$, $x\\ge0$, $y\\ge0$.', 'Các điều kiện là $x+y\\ge ' + N + '$, $' + c1 + 'x+' + c2 + 'y\\le ' + M + '$, $x\\ge0$, $y\\ge0$.', 'Diện tích không quá $' + N + '$ sào: $x+y\\le ' + N + '$; tiền vốn không quá $' + M + '$ triệu: $' + c1 + 'x+' + c2 + 'y\\le ' + M + '$.'],
        ['Miền nghiệm của hệ là một tứ giác có một đỉnh là điểm $' + dinhDung + '$.', 'Miền nghiệm của hệ là một tứ giác có một đỉnh là điểm $' + dinhSai + '$.', 'Đỉnh là giao điểm của $x+y=' + N + '$ và $' + c1 + 'x+' + c2 + 'y=' + M + '$: giải hệ được $' + dinhDung + '$. Các đỉnh khác: $O(0;0)$, $\\left(' + (X === N ? String(N) : ps(M, c1)) + ';0\\right)$, $\\left(0;' + (Yy === N ? N : ps(M, c2)) + '\\right)$.'],

  cau.push({ phan: 2, muc: 'Biết → Vận dụng', chuDe: 'Hệ thức lượng: côsin, Heron, đường cao, bán kính',

  cau.push({ phan: 2, muc: 'Biết → Vận dụng', chuDe: 'Toạ độ: tích vô hướng, góc, chân đường cao',

      if (u[0] * v[1] - u[1] * v[0] === 0) lai();
      var d = u[0] * v[0] + u[1] * v[1], n1 = u[0] * u[0] + u[1] * u[1], n2 = v[0] * v[0] + v[1] * v[1], nw = w[0] * w[0] + w[1] * w[1];
      if (d === 0 || n1 === n2) lai();
      var tTu = (A[0] - B[0]) * w[0] + (A[1] - B[1]) * w[1], H = [ps(B[0] * nw + tTu * w[0], nw), ps(B[1] * nw + tTu * w[1], nw)], Mi = [ps(B[0] + C[0], 2), ps(B[1] + C[1], 2)];
      if (H[0] === Mi[0] && H[1] === Mi[1]) lai();
      var dSai = u[0] * v[0] - u[1] * v[1]; if (dSai === d) dSai = d + 3;

        ['Chân đường cao kẻ từ $A$ của tam giác $ABC$ là $H\\left(' + H[0] + ';' + H[1] + '\\right)$.', 'Chân đường cao kẻ từ $A$ của tam giác $ABC$ là $H\\left(' + Mi[0] + ';' + Mi[1] + '\\right)$.',

      ]);
      return { loai: 'ds', de: 'Trong mặt phẳng toạ độ $Oxy$, cho tam giác $ABC$ với $A' + td(A[0], A[1]) + '$, $B' + td(B[0], B[1]) + '$, $C' + td(C[0], C[1]) + '$. Xét tính Đúng – Sai trong các khẳng định sau.', y: y };
    } });

  cau.push({ phan: 3, muc: 'Vận dụng', chuDe: 'Bài toán thực tế về tập hợp (biểu đồ Ven)',

  cau.push({ phan: 3, muc: 'Vận dụng', chuDe: 'Biến đổi biểu thức lượng giác khi biết $\\tan\\alpha$',

  cau.push({ phan: 3, muc: 'Vận dụng', chuDe: 'Bài toán chi phí nhỏ nhất (hệ bất phương trình)',

    tao: function (r) {

  return 'Em ghi: <span class="' + (ok ? 'd' : 's') + '">' + (String(a || '').trim() ? esc(a) : 'bỏ trống') + '</span> · Đáp án: <span class="d">' + esc(q.hienDa) + '</span>';
}
function phanDeVaGiaiOT(q, a, coBaiLam) { // đề, phương án (đánh dấu), lời giải
  var h = '<div class="de">' + tex(q.de) + '</div>' + (q.hinh || '');
  if (q.loai === 'tn') h += '<div class="ot-pa xem">' + q.pa.map(function (p, k) { return '<button type="button" tabindex="-1" class="' + (k === q.dung ? 'dung' : coBaiLam && a === k ? 'sai' : '') + '"><span class="ch">' + 'ABCD'[k] + '</span><span>' + tex(p) + '</span>' + (k === q.dung ? ' ' + ic('dung') : '') + '</button>'; }).join('') + '</div>' +
    '<div class="ot-giai"><b class="tde">Lời giải · Đáp án ' + 'ABCD'[q.dung] + '</b>' + tex(q.giai) + '</div>';
  else if (q.loai === 'ds') h += '<table class="ot-bang-ds"><tr><th>Ý</th><th>Khẳng định</th>' + (coBaiLam ? '<th>Em</th>' : '') + '<th>Đáp án</th></tr>' + q.y.map(function (y, k) {
      var x = a ? a[k] : null;
      return '<tr><td><b>' + 'abcd'[k] + ')</b></td><td>' + tex(y.t) + '</td>' + (coBaiLam ? '<td class="' + (x === y.dung ? 'd' : 's') + '">' + (x == null ? '—' : x ? 'Đúng' : 'Sai') + '</td>' : '') + '<td class="' + (y.dung ? 'd' : 's') + '">' + (y.dung ? 'Đúng' : 'Sai') + '</td></tr>';
    }).join('') + '</table><div class="ot-giai"><b class="tde">Lời giải</b>' + q.y.map(function (y, k) { return '<b>' + 'abcd'[k] + ') ' + (y.dung ? 'Đúng' : 'Sai') + '.</b> ' + tex(y.giai); }).join('<br>') + '</div>';
  else h += '<div class="ot-giai"><b class="tde">Lời giải · Đáp số ' + esc(q.hienDa) + '</b>' + tex(q.giai) + '</div>';
  return h;
}
function theLoiGiaiOT(cau, i, a, c) {
  var q = cau[i];
  return '<div class="the" id="lg-' + i + '" style="scroll-margin-top:80px"><div class="ot-dau-cau"><span class="chip-hang" style="margin:0"><span class="chip muc-th">' + OT_TEN_PHAN[q.phan] + '</span><span class="chip">Câu ' + soThuTuCau(cau, i) + '</span>' + (q.muc ? '<span class="chip">' + esc(q.muc) + '</span>' : '') + '</span>' +
    '<span class="nhan ' + (c.dung ? 'd100' : c.tram ? 'dmot' : '') + '"' + (!c.dung && !c.tram ? ' style="background:var(--sai2);color:var(--sai)"' : '') + '>' + diemVN(c.tram) + '/' + diemVN(c.toiDa) + ' đ</span></div>' +
    phanDeVaGiaiOT(q, a, true) + '<p class="ot-tom">' + tomTatTraLoiOT(q, a) + '</p></div>';
}
function noiDungOnTapOT(O) {
  var sai = []; O.cau.forEach(function (q, i) { if (!O.kq.tung[i].dung) sai.push(i); });
  if (!sai.length) return '<div class="the"><div class="thong-bao dung">' + ic('dung') + '<span>Em làm đúng tất cả các câu. Không có nội dung nào cần ôn thêm. Tuyệt vời!</span></div></div>';
  return '<div class="thong-bao vang">' + ic('sach') + '<span>Em chưa làm đúng hoàn toàn ' + sai.length + ' câu. Với mỗi câu: đọc lại <b>kiến thức cần nhớ</b>, rồi xem <b>ví dụ mẫu</b> (cùng dạng, số liệu khác) trước khi làm đề mới.</span></div>' +
    sai.map(function (i) {
      var q = O.cau[i], dn = O.de.cau[i], vd = taoCauOnTap(dn, O.seed + 500009, i);
      return '<div class="the"><div class="ot-dau-cau"><b style="font-size:16px">Câu ' + soThuTuCau(O.cau, i) + ' (' + OT_TEN_PHAN[q.phan].split(' · ')[0] + '): ' + tex(dn.chuDe) + (dn.muc ? '<span class="ot-muc">' + esc(dn.muc) + '</span>' : '') + '</b>' +
        '<a href="#" data-lg="' + i + '" class="nho">Xem lại câu này ›</a></div><p class="ot-tom" style="margin:0">' + tomTatTraLoiOT(q, O.tl[i]) + '</p>' +
        '<div class="ot-kt"><b class="tde">Kiến thức cần nhớ</b>' + tex(dn.kienThuc) + '</div>' +
        '<div class="ot-vd"><b>Ví dụ mẫu</b>' + phanDeVaGiaiOT(vd, null, false) + '</div></div>';
    }).join('');
}
document.addEventListener('click', function (e) {
  var a = e.target.closest && e.target.closest('a[data-lg]');
  if (a && S.ot && S.ot.xong) { e.preventDefault(); moTabOT('lg', Number(a.getAttribute('data-lg'))); }
});
/* ---------- phía thầy: bảng điểm đề ôn tập và xem lại bài ---------- */
function veBangOnTap(noi, ma) {
  var du = S.ql.du, de = timDeOT(ma), luot = du.kq.filter(function (r) { return r.maCau === ma; }), tot = {};
  luot.forEach(function (r) { var k = r.tk.toLowerCase(), c = tot[k]; if (!c) c = tot[k] = { cao: r, lan: 0, cuoi: r }; c.lan++; if (r.muc > c.cao.muc) c.cao = r; if (r.tg > c.cuoi.tg) c.cuoi = r; });
  var diemR = function (r) { var ct = {}; try { ct = JSON.parse(r.chiTiet || '{}'); } catch (e) {} return ct.diem != null ? Math.round(ct.diem * 100) : r.muc * 10; };
  var daLam = du.hs.filter(function (hs) { return tot[hs.tk.toLowerCase()]; }), tb = daLam.length ? daLam.reduce(function (s, hs) { return s + diemR(tot[hs.tk.toLowerCase()].cao); }, 0) / daLam.length : 0;
  // tỉ lệ đúng từng câu (trên lượt cao nhất của mỗi bạn)
  var dungCau = de.cau.map(function () { return 0; });
  daLam.forEach(function (hs) { var ct = {}; try { ct = JSON.parse(tot[hs.tk.toLowerCase()].cao.chiTiet || '{}'); } catch (e) {} (ct.dc || []).forEach(function (t, i) { var td = de.cau[i].phan === 1 ? 25 : de.cau[i].phan === 2 ? 100 : 50; if (t >= td) dungCau[i]++; }); });
  var h = '<div class="the"><h3 style="margin:0 0 10px;font-size:16px">' + esc(de.ten) + ' (Lớp ' + esc(de.lop) + ')</h3><div class="o-tk">' +
    '<div><span class="so">' + daLam.length + '/' + du.hs.length + '</span><span class="mo">bạn đã làm</span></div>' +
    '<div><span class="so">' + (daLam.length ? diemVN(Math.round(tb)) : '–') + '</span><span class="mo">điểm TB (lần cao nhất)</span></div>' +
    '<div><span class="so">' + luot.length + '</span><span class="mo">lượt làm</span></div></div></div>' +
    '<div class="the"><div class="mo">Điểm thang 10 theo cấu trúc mới. Mỗi lượt là một đề khác số liệu. Bấm tên học sinh để xem từng lượt và bài làm.</div><div class="bang-cuon"><table class="bang"><tr><th>Học sinh</th><th>Điểm cao nhất</th><th>Lần gần nhất</th><th>Số lần</th></tr>' +
    du.hs.map(function (hs) {
      var c = tot[hs.tk.toLowerCase()];
      return '<tr><td><a href="#" data-tk="' + esc(hs.tk) + '">' + esc(hs.hoTen) + '</a></td>' + (c ? '<td><b>' + diemVN(diemR(c.cao)) + '</b></td><td>' + diemVN(diemR(c.cuoi)) + ' <span class="mo">(' + ngayGio(c.cuoi.tg) + ')</span></td><td>' + c.lan + '</td>' : '<td class="mo">chưa làm</td><td></td><td></td>') + '</tr>';
    }).join('') + '</table></div></div>';
  if (daLam.length) h += '<div class="the"><b>Tỉ lệ bạn làm đúng từng câu</b><div class="mo nho">Tính trên lần làm cao nhất của mỗi bạn; câu đúng sai tính là đúng khi đúng cả 4 ý.</div><div class="bang-cuon"><table class="bang"><tr><th>Câu</th><th>Nội dung</th><th>Đúng</th></tr>' +
    de.cau.map(function (c, i) { var pt = Math.round(100 * dungCau[i] / daLam.length); return '<tr><td>' + OT_LA_MA[c.phan] + '.' + soThuTuCau(de.cau, i) + '</td><td>' + tex(c.chuDe) + '</td><td><span class="diem ' + lopDiem(pt) + '">' + pt + '%</span></td></tr>'; }).join('') + '</table></div></div>';
  noi.innerHTML = h;
  noi.querySelectorAll('a[data-tk]').forEach(function (a) { a.onclick = function (e) { e.preventDefault(); veChiTietHS(a.getAttribute('data-tk')); }; });
}
function xemLaiBaiOT(r, x) {
  var de = timDeOT(r.maCau), ct = {}; try { ct = JSON.parse(r.chiTiet || '{}'); } catch (e) {}
  var cau = taoDeOnTap(de, Number(r.seed)), tl = ct.tl || [], kq = chamDeOT(cau, tl);
  x.innerHTML = '<div class="the"><b>' + esc(de.tenNgan) + ' · Mã đề ' + esc(r.seed) + ' · ' + diemVN(kq.tram) + ' điểm</b><div class="mo nho">Đề và bài làm của học sinh, có lời giải.</div></div>' +
    cau.map(function (q, i) { return theLoiGiaiOT(cau, i, tl[i], kq.tung[i]); }).join('');
  x.scrollIntoView({ behavior: 'smooth' });
}
